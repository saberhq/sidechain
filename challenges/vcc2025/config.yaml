# Points the year-agnostic core at the 2025 data.
#
# Read by `loaders.load_challenge_config`. Values only — the operating notes
# (what will bite you, how to run it) live in CLAUDE.md beside this file.
#
# Frozen: this describes the 2025 spec. Don't edit it to chase 2026 changes.

year: 2025
data_dir: "~/data/sidechain/vcc2025"
cell_type: "H1_hESC"

source_file: adata_Training.h5ad
dev_file: adata_Training_subset.h5ad     # smaller local subset, for smoke tests

pert_col: target_gene
control_label: "non-targeting"           # the only control arm present in this data
control_types: [ntc]

metrics: [des, pds, mae]
extra_state_metrics: true                # adds STATE's four extras -> 7 total

# Challenge-time conditions: entrants only had names/counts for held-out
# perturbations, so we carve a holdout from the training set
# (`loaders.carve_holdout`). Whole perturbations, never individual cells, because
# the task is generalizing to unseen genes.
splits:
  scheme: carve_from_training
  holdout_perturbations: 50              # matches the size of Arc's validation list
  stratify_by: target_gene
  seed: 20250101

# The real answers, published by Arc on 2025-12-16 (after the final ranking).
# `sidechain.eval.backtest` trains on the full training file and scores against
# one of these. Both carry the same 38,176 non-targeting cells as the training
# file (verified by obs_names) and the identical var_names order, but no
# var['gene_id'] column -- backtest adopts the training var wholesale.
external_holdouts:
  validation: adata_Validation.h5ad      # 50 perts / 60,751 cells; drove the live leaderboard
  test: adata_Test.h5ad                  # 100 perts / 132,670 cells; decided the final ranking

# var_names are HGNC symbols; var['gene_id'] holds Ensembl IDs. Both ship inside
# the h5ad, so no external mapping table is needed.
gene_id_space: hgnc_symbol
ensembl_ids_in: "var['gene_id']"
requires_id_mapping_to: ensembl_gene_id

baseline_agg_results: null               # path to a baseline for `cell-eval score`
