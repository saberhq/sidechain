[project]
name = "sidechain"
version = "0.0.1"
description = "Predicting transcriptional response to genetic perturbation."
# Upper bound is deliberate: without it uv forks the resolution at 3.12 and the
# Mac and the rented GPU box end up on different major versions of anndata.
requires-python = ">=3.11,<3.13"
dependencies = [
  # single-cell core
  "scanpy",
  "anndata",
  "pertpy", # perturbation analysis, Mixscape, E-distance (scverse)
  "decoupler", # DoRothEA/TRRUST access via OmniPath
  # arc challenge plumbing -- all five publish to PyPI
  "arc-state", # STATE baseline + `state tx`
  "cell-load", # Arc dataloaders
  "cell-eval", # 2025 scorer -- the 2025 backtest mirror wraps this
  "cell-eval2>=0.16.0", # 2026 scorer (preset `vcc2026`); added at kickoff 2026-08-20
  "pdex", # Arc differential expression
  # modeling
  "torch",
  "torch-geometric", # sparse multi-relational GNN (edge_index / COO)
  "numpy",
  "scipy",
  "pandas",
  # sequence priors
  "transformers", # Nucleotide Transformer inference
  # infra
  "lamindb>=2.9.1,<3", # dataset + run/artifact versioning; floor-pinned -- 2.x releases monthly and the Mac and the box must resolve alike
  "pyyaml",
  "typer", # small CLIs
  "zstandard>=0.25.0",
]

[dependency-groups]
# uv installs this on a plain `uv sync`.
dev = ["pytest>=8", "pytest-cov", "ruff", "fonttools", "pillow"]  # the last two: scripts/wordmark.py

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
# The GPU box only: cell-eval2's CUDA kernels + GPU differential expression
# (gpudge), which is what makes a locally built scoring bundle match the
# competition rule byte for byte. `uv sync --extra gpu` on Linux; a no-op on the Mac.
gpu = ["cell-eval2[gpu,gpudge]; sys_platform == 'linux'"]

[tool.uv]
# Commit uv.lock so the Mac and the GPU box resolve identically. Re-pinned at the
# 2026-08-20 kickoff (cell-eval2 added); re-pin again if Arc bumps the scorer.
#
# torch on Linux comes from the CUDA-12.6 wheel index: the default index serves a
# CUDA-13 build that the Brev boxes' 570-series driver cannot run (cuda False), and
# `uv run` re-syncs the env to this lock before every command, so a hand-installed
# torch is silently replaced. The Mac keeps the default (CPU/MPS) build.

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
