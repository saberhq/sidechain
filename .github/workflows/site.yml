# Builds site/ with Hugo and publishes it with GitHub Pages.
#
# Where it lands: https://saberh.com/sidechain/ — GitHub serves every project site of an
# account under the user site's custom domain (saberhq.github.io carries saberh.com), so
# nothing in the personal site's repo has to change. Hugo's baseURL already carries the
# /sidechain/ path (site/hugo.toml).
#
# One-time setup, before the first run: Pages must be enabled on this repo with
# "GitHub Actions" as the source — the workflow token cannot do that itself. Either
#   gh api -X POST repos/saberhq/sidechain/pages -f build_type=workflow
# or Settings → Pages → Source: GitHub Actions. Until then the deploy job fails.

name: Publish site to saberh.com/sidechain

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - "scripts/saberhq_rebuild.py"
      - "scripts/indexnow.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      posts: ${{ steps.posts.outputs.posts }}
      urls: ${{ steps.urls.outputs.urls }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.148.2"   # same pin as saberhq.github.io
          extended: true

      - name: Build
        run: |
          export HUGO_PARAMS_VERSION="$(python3 -c 'import json; print(json.load(open("site/kit.lock.json"))["ref"])')"
          hugo --source site --minify --cleanDestinationDir

      - name: List the posts this build published
        id: posts
        run: echo "posts=$(python3 scripts/saberhq_rebuild.py --guids site/public/posts/index.xml)" >> "$GITHUB_OUTPUT"

      - name: List the pages this build published
        id: urls
        run: echo "urls=$(python3 scripts/indexnow.py --urls site/public/sitemap.xml)" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # Starts saberh.com's rebuild once the live feed lists this build's posts, only when one has no card on
  # saberh.com/blog/ yet. Never fails this site's deploy.
  saberhq-blog:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/saberhq_rebuild.py
          sparse-checkout-cone-mode: false

      - name: Start saberh.com's rebuild if a post has no card on its blog yet
        env:
          GH_TOKEN: ${{ secrets.SABERHQ_SITE_DISPATCH }}
          EXPECT: ${{ needs.build.outputs.posts }}
        run: python3 scripts/saberhq_rebuild.py --expect "$EXPECT"

  # Tells the IndexNow search engines (Bing, Yandex and others) which pages this deploy published. Never fails
  # this site's deploy.
  indexnow:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/indexnow.py
            site/static/*.txt
          sparse-checkout-cone-mode: false

      - name: Submit this deploy's pages to IndexNow
        env:
          URLS: ${{ needs.build.outputs.urls }}
        run: python3 scripts/indexnow.py --submit "$URLS" --wait 600
