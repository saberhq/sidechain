# Refresh the README's live-rank badge.
#
# Hourly, fetch the official leaderboard, build the shields.io endpoint JSON for our
# team (sidechain.eval.badge) and commit it to the orphan `badges` branch. The README
# points img.shields.io/endpoint at that file, so the badge updates without a commit
# on main. If the fetch fails the job fails and the previous badge stays up.
name: leaderboard badge

on:
  schedule:
    - cron: "17 * * * *" # hourly; GitHub runs scheduled jobs best-effort
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard-badge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: badges
          path: badges
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build badge
        id: badge
        run: |
          msg=$(PYTHONPATH=src python -m sidechain.eval.badge --team Sidechain --out badges/leaderboard.json)
          echo "message=$msg" >> "$GITHUB_OUTPUT"
      - name: commit if changed
        working-directory: badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json
          if git diff --cached --quiet; then
            echo "unchanged: ${{ steps.badge.outputs.message }}"
            exit 0
          fi
          git commit -m "leaderboard: ${{ steps.badge.outputs.message }}"
          git push
