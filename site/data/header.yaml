# The header. sides: the halves of the site, each with its tabs, left to right; url is where its switch leads.
sides:
  - id: professional
    name: Professional
    url: /
    tabs: [sidechain, blog, about]
  - id: personal
    name: Personal
    url: /vibes/
    tabs: [vibes]

# tabs: every place a tab can name (accent: sidechain is carmine, vibes is blue hour).
# trail: false means the pages inside it show no trail under the header.
tabs:
  sidechain: {name: Sidechain, url: /sidechain/, accent: sidechain}
  blog: {name: Blog, url: /blog/}
  about: {name: About, url: /about/}
  vibes: {name: Saber Vibes, url: /vibes/, accent: vibes, trail: false}

# fold: tabs listed first inside Elsewhere on the side that doesn't show them.
fold:
  - about

# Elsewhere: Saber on other sites.
elsewhere:
  - name: GitHub
    url: https://github.com/saberhq
  - name: LinkedIn
    url: https://www.linkedin.com/in/saberhq
  - name: Scholar
    url: https://scholar.google.com/citations?user=q2fsO2IAAAAJ&hl=en
  - name: ORCID
    url: https://orcid.org/0000-0003-0553-9227
  - name: YouTube
    url: https://www.youtube.com/@saberhq
  - name: X
    url: https://x.com/saberhq
