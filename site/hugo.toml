# Sidechain's page at saberhq.com/sidechain — a sibling of the personal site, not a twin.
#
# Themeless Hugo: every template is in layouts/, every visual value comes from the brand
# tokens copied verbatim from saberhq.github.io (assets/tokens/, synced by
# scripts/brand_sync.py). Served by GitHub Pages under the user site's custom domain,
# which is why baseURL carries the /sidechain/ path.
#
#   hugo server --source site         # http://localhost:1313/sidechain/
#   hugo --source site --minify       # -> site/public/

baseURL = "https://saberhq.com/sidechain/"
languageCode = "en-us"
title = "Sidechain"
enableRobotsTXT = true
timeZone = "UTC"

# No tag/category pages: nothing to put on them yet, and each would be an empty page.
disableKinds = ["taxonomy", "term"]

[params]
  author = "Saber Hafezqorani"
  description = "Predicting how a cell's transcriptome shifts when a gene is silenced — a solo entry to the Virtual Cell Challenge 2026, built in the open."
  images = ["og.png"]              # social card (generated by scripts/wordmark.py)
  parent = "https://saberhq.com/"  # the site this one lives inside
  repo = "https://github.com/saberhq/sidechain"
  linkedin = "https://www.linkedin.com/in/saberhq"
  challenge = "https://virtualcellchallenge.org/"
  leaderboard = "https://virtualcellchallenge.org/leaderboard"

# Header nav — every link leaves the page, so they open in a new tab.
[menu]
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/saberhq/sidechain"
    weight = 10
  [[menu.main]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/saberhq"
    weight = 20
  [[menu.main]]
    name = "Challenge"
    url = "https://virtualcellchallenge.org/"
    weight = 30

[markup]
  [markup.goldmark.renderer]
    unsafe = true            # raw HTML in posts (figures, details blocks)
  [markup.highlight]
    noClasses = false        # class-based: assets/chroma-{light,dark}.css follow the theme
    lineNumbers = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[services.rss]
  limit = 20

# Mounts. private/site/ is where site material that must never reach this repo lives —
# the ledger dashboard being the case that forced this. Its data carries private idea and
# report titles, so the routing rule in CLAUDE.md puts it on the private side.
#
# Three independent things have to fail before any of it could publish:
#   1. .gitignore blocks private/ here, so `git add -A` cannot stage it;
#   2. it is committed to the private repo instead, which has no Pages deploy;
#   3. the Actions runner checks out only this repo, so ../private/ does not exist there —
#      Hugo skips a mount whose source is missing, without warning or error, and simply
#      builds the site without those pages. Verified against 0.148.2.
#
# So `hugo server --source site` renders the private pages for local review, and the
# deployed site cannot contain them. Declaring any mount replaces Hugo's defaults, which is
# why every default directory is re-declared below — dropping one silently empties it.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../private/site/content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "../private/site/data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "../private/site/layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
