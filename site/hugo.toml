# Sidechain's page at saberh.com/sidechain — a sibling of the personal site, not a twin.
#
# Themeless Hugo: every template is in layouts/, every visual value comes from the brand
# tokens copied verbatim from saberhq.github.io (assets/tokens/, part of the kit that
# scripts/kit-pull copies). Served by GitHub Pages under the user site's custom domain,
# which is why baseURL carries the /sidechain/ path.
#
#   hugo server --source site         # http://localhost:1313/sidechain/
#   hugo --source site --minify       # -> site/public/

baseURL = "https://saberh.com/sidechain/"
languageCode = "en-us"
title = "Sidechain"
enableRobotsTXT = false
timeZone = "UTC"

# No tag/category pages: nothing to put on them yet, and each would be an empty page.
disableKinds = ["taxonomy", "term"]

[params]
  author = "Saber Hafezqorani"
  description = "Predicting how a cell's transcriptome shifts when a gene is silenced — a solo entry to the Virtual Cell Challenge 2026, built in the open."
  images = ["og.png"]              # social card (generated by scripts/wordmark.py)
  parent = "https://saberh.com/"  # the site this one lives inside
  repo = "https://github.com/saberhq/sidechain"
  linkedin = "https://www.linkedin.com/in/saberhq"
  challenge = "https://virtualcellchallenge.org/"
  leaderboard = "https://virtualcellchallenge.org/leaderboard"
  area = "sidechain"               # the kit's kicker word and card chip (data/areas.yaml)
  newTab = ["/resume/"]            # saberh.com pages that open in a new tab (the kit's new-tab)
  contentHistory = "https://github.com/saberhq/sidechain/commits/main/site/content/"  # a post's "updated" link
  license = "https://opensource.org/license/mit"
  parent_id = "https://saberh.com/#website"   # saberh.com's WebSite node in the JSON-LD

# The author in the JSON-LD; `id` is the Person node saberh.com publishes.
[params.person]
  id = "https://saberh.com/#person"
  name = "Saber Hafezqorani"
  url = "https://saberh.com/"
  sameas = ["https://github.com/saberhq", "https://www.linkedin.com/in/saberhq/", "https://orcid.org/0000-0003-0553-9227"]

# The licence the kit footer names for these pages.
[params.contentLicense]
  name = "MIT"
  url = "https://github.com/saberhq/sidechain/blob/main/LICENSE"

[markup]
  [markup.goldmark.renderer]
    unsafe = true            # raw HTML in posts (figures, details blocks)
  [markup.highlight]
    noClasses = false        # class-based: assets/chroma-{light,dark}.css follow the theme
    lineNumbers = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML", "RSS", "llms"]
  section = ["HTML", "RSS"]
  page = ["HTML", "markdown"]

# /sidechain/llms.txt: the site map for language-model agents (llmstxt.org).
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

# index.md beside each page's index.html: the page as Markdown.
[outputFormats.markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  rel = "alternate"

[services.rss]
  limit = 20

# The kit footer's Email link reads the first mailto: here.
[[menus.after]]
  name = "Contact me"
  url = "mailto:saber.hafezqorani@gmail.com"
  weight = 10
