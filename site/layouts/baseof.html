<!DOCTYPE html>
<html lang="{{ default .Site.Language.Lang .Site.LanguageCode }}" dir="ltr">
<head>
  {{ partial "head.html" . }}
</head>
<body class="sq-shell">
  {{ block "header" . }}
    {{ partial "site-header.html" (dict "page" . "crumb" "sidechain") }}
  {{ end }}

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  {{ block "footer" . }}
    {{ partial "site-footer.html" (dict "page" .) }}
  {{ end }}
  {{ partial "scripts.html" . }}
</body>
</html>
