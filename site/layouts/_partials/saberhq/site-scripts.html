{{/* The theme switch: any element with data-theme-toggle flips light/dark and keeps the choice. */}}
<script>
(function () {
  var root = document.documentElement;
  function mark() {
    var dark = root.getAttribute('data-theme') === 'dark';
    document.querySelectorAll('[data-theme-toggle][role="switch"]').forEach(function (b) {
      b.setAttribute('aria-checked', dark ? 'true' : 'false');
    });
  }
  mark();
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-theme-toggle]');
    if (!btn) return;
    var toDark = root.getAttribute('data-theme') !== 'dark';
    if (toDark) { root.setAttribute('data-theme', 'dark'); } else { root.removeAttribute('data-theme'); }
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
      m.removeAttribute('media');
      m.setAttribute('content', toDark ? '#16130F' : '#FAF9F7');
    });
    try { localStorage.setItem('saberhq-theme', toDark ? 'dark' : 'light'); } catch (err) {}
    mark();
  });
})();
</script>

{{/* The header's Elsewhere menu: a click anywhere else, or Escape, closes it. */}}
<script>
(function () {
  function shut(focus) {
    document.querySelectorAll('details.sq-menu-more[open]').forEach(function (d) {
      d.removeAttribute('open');
      if (focus) { var s = d.querySelector('summary'); if (s) s.focus(); }
    });
  }
  document.addEventListener('click', function (e) {
    if (!(e.target.closest && e.target.closest('details.sq-menu-more'))) shut(false);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') shut(true); });
})();
</script>
