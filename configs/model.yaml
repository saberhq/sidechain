# Which rung(s) are active, and head hyperparameters. Climb the ladder; keep the winner.
#
# HONESTY NOTE: no code reads this file yet. dry_run selects rungs via --rungs and
# the predictors take their knobs as constructor arguments; this file states the
# intended defaults so the wiring, when it lands, has one authority to read.
# Editing it changes nothing today. (Tracked in the TODO.)
active_rungs: ["0", "0b", "1"]  # what dry_run runs by default today

rung1_statistical:
  # Mirrors StatisticalBackbone's actual constructor knobs (baseline_stats.py).
  deg_z: 2.0                  # |z| gate for the DEG-frequency feature
  response_scale: 1.0         # scales the DEG-freq-weighted generic response
  min_cells: 10               # training perturbations below this are skipped in fit
  apply_knockdown: true       # replace the target gene's delta with the mean self-knockdown
  pseudobulk: {aggregate: sum, group_by: [target_gene], min_cells: 25}
  features: [deg_frequency, mean_expression, gene_variance, effect_size_prior]

rung2_state:
  checkpoint: null            # path to STATE ST checkpoint; fill after `state tx` fine-tune
  finetune: true

rung3_residual_gnn:
  enabled: false              # residual-gated: turn on only if it beats Rung 1 locally
  layers: 2                   # 2-3 message-passing layers
  hidden_dim: 256
  edge_types: from_registry   # auto-populated from enabled data_sources.yaml entries
  node_features: [expr_embed, cis_seq_embed]

rung4_fusion:
  loss_weights: {pds: 1.0, des: 1.0, mae: 0.2}   # BioMap-style fused, metric-aware
  n_replicate_outputs: 20     # emit a distribution so DES has dispersion
