# Year-agnostic half of the eval harness. Nothing is trusted until it clears this.
#
# Metric SELECTION is deliberately not here: which metrics count is a per-year
# challenge fact and lives in challenges/<year>/config.yaml. This file holds the
# policy that does not change year to year -- holdout discipline, guardrails,
# where output lands.
#
# Merge order:
#   challenge config (metrics, control label, pert column)  OVERRIDES  this file.

# Declared policy, NOT yet read by code: local_mirror ignores this block, and the
# discipline is currently upheld by hand (and by dry_run's design). Wire or
# delete when the split machinery lands.
holdout:
  scheme: context_transfer          # mimic the challenge's generalize-to-new-context split
  never_tune_on: private_local

guardrails:
  variance_inflation_check: true    # LIVE: score() runs it -- catches PDS leaderboard-hacking
  variance_inflation_tolerance: 1.5 # LIVE: pred/real per-gene variance ratio above which we flag
  block_if_only_public_split_gain: true   # NOT implemented in local_mirror yet -- intent only

# NOT yet read by score(); callers pass outdir explicitly and this default is
# duplicated in code (local_mirror.score, dry_run). Wire or delete when
# log_run lands.
output:
  outdir: ~/data/sidechain/runs/cell-eval
  write_csv: true

# Fallbacks used only when no challenge config is passed. The challenge config is
# the authority whenever one is supplied.
cell_eval:
  metrics: [des, pds, mae]
  extra_state_metrics: true
