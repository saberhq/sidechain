# ============================================================================
# Sidechain prior-source registry: one block per prior, each naming its loader
# class in src/sidechain/priors/ (`loader`). Every source maps onto
# `master_gene_space`. A block is retired with `enabled: false`, never deleted.
#
# Every block declares `kind:`, `edge` or `node_feature`. `relation:` need not
# be unique: the graph builder keys edge types on `layer:relation:name`. A
# block that fetches its bytes declares the ingest gate's keys, as in
# datasets.yaml.
#
# Notes: private/code-notes/configs/data_sources.yaml.md
# ============================================================================

master_gene_space:
  reference: gencode
  version: "v47"
  id_type: ensembl_gene_id       # the key every PriorSource maps onto

sources:

  # ---------------- TRANS layer: transcriptional regulation ----------------
  - name: dorothea
    kind: edge
    layer: trans
    relation: tf_target
    entity: gene
    loader: TransGRNSource
    provider: "DoRothEA via decoupler/OmniPath"
    url: "https://omnipathdb.org"
    directed: true
    signed: true                 # +1 activation / -1 repression
    confidence_levels: [A, B, C] # drop D/E (low-confidence) by default
    enabled: true
    notes: "Directed, signed TF->target. Signs let the cascade propagate up/down."

  - name: string
    kind: edge
    layer: trans
    relation: functional_ppi
    entity: gene
    loader: TransGRNSource
    provider: "STRING v12"
    url: "https://string-db.org"
    directed: false
    score_threshold: 700         # high-confidence edges only
    enabled: true
    notes: "Undirected functional/PPI edges; clusters co-regulated nodes."

  # ---------------- CIS layer: sequence-derived node features ----------------
  - name: nt_utr_embed
    kind: node_feature
    layer: cis
    relation: utr_embedding      # a semantic name; `kind` carries node-vs-edge
    entity: transcript_3utr
    loader: CisSequenceSource
    model: "InstaDeepAI/nucleotide-transformer-v2-500m-multi-species"
    sequence_region: "3utr"      # one of {3utr, full_cdna, 5utr}
    fallback_region: "full_cdna" # if no annotated 3'UTR
    pooling: "mean_over_chunks"  # chunk long UTRs, then pool
    embed_dim: 1024
    precompute: true             # compute once on a rented GPU, cache in lamindb
    enabled: true
    notes: "Per-gene 3'UTR embedding as a frozen node feature. The modern ntEmbd."

  # ------------ Gene tables: one vector per gene, keyed on symbol ------------
  # Shelved: no PriorSource loader reads a symbol-keyed table yet.
  - name: esm2_3b_gene_table
    kind: node_feature
    layer: cis
    relation: gene_embedding
    entity: gene
    loader: GeneTableSource        # not written
    provider: "ESM-2 3B (Meta) as shipped inside TranscriptFormer tf_sapiens (CZI, MIT)"
    url: "https://czi-transcriptformer.s3.amazonaws.com/weights/tf_sapiens.tar.gz"
    path: "~/data/sidechain/derived/transcriptformer-esm2-3b/esm2_3b_raw_table.pt"
    sha256: "429d2cfbed0cd817d8eae78efb8cba590137d0dcc2dce84c844fea85b7056328"
    key_type: hgnc_symbol          # retired symbols via sidechain.data.gene_aliases
    embed_dim: 2560
    precompute: true
    enabled: false
    notes: "ESM-2 3B protein embeddings, one row per gene symbol; LINEAGE.json beside the file."

  - name: esm2_se600m_gene_table
    kind: node_feature
    layer: cis
    relation: gene_embedding
    entity: gene
    loader: GeneTableSource        # not written
    provider: "ESM-2 15B (Meta) as shipped by Arc Institute beside SE-600M"
    url: "https://huggingface.co/arcinstitute/SE-600M"
    path: "~/data/sidechain/derived/esm2-15b-se600m/esm2_15b_gene_table.pt"
    sha256: "a210e1cc7901513999b2bca3836ba9e2f203cd008be4e9a9d6412a2267de9748"
    key_type: hgnc_symbol          # retired symbols via sidechain.data.gene_aliases
    embed_dim: 5120
    precompute: true
    enabled: false
    notes: "ESM-2 15B protein embeddings, one row per gene symbol: a byte-identical copy of the Hugging Face file, LINEAGE.json beside it."

  # ------------ PHENOTYPE layer: fitness-screen gene effects ------------
  - name: depmap_24q4_gene_effect
    kind: node_feature
    layer: phenotype
    relation: gene_effect_profile
    entity: gene
    loader: GeneTableSource        # not written
    provider: "DepMap Public 24Q4 (Broad Institute), Chronos gene effect"
    url: "https://doi.org/10.25452/figshare.plus.27993248.v1"
    key_type: hgnc_symbol          # columns headed `SYMBOL (Entrez)`; retired symbols via sidechain.data.gene_aliases
    precompute: true
    enabled: false
    notes: "One Chronos fitness-effect score per gene per screened cell line (about 0 for a gene the line does not need, about -1 for a common-essential one), and the release's common-essential flags."
    # Fetched through the ingest gate (sidechain.ingest.fetch.run_gate).
    host: figshare
    record: "27993248.v1"
    dest: external/figshare-27993248
    derived: derived/depmap-24q4             # gene_effect_table.pt, common_essential.tsv + LINEAGE.json
    budget_gb: 1.1
    license: CC-BY-4.0
    files:
      # Gene effect: one row per screened model (`ACH-…`), one column per gene.
      - name: CRISPRGeneEffect.csv
      # The genes the release infers as common-essential.
      - name: CRISPRInferredCommonEssentials.csv
      # The curated essential and non-essential control genes.
      - name: AchillesCommonEssentialControls.csv
      - name: AchillesNonessentialControls.csv
      # One row per model: name, lineage, disease.
      - name: Model.csv
      # HGNC's gene table as the release ships it: symbols, aliases, Entrez and Ensembl ids.
      - name: Gene.csv
      # The release's description of every file.
      - name: README.txt
      # Bulk RNA-seq per model, log2(TPM + 1), one column per protein-coding gene.
      - name: OmicsExpressionProteinCodingGenesTPMLogp1.csv

  # ------------ POST-TRANSCRIPTIONAL layer: 3'UTR regulatory grammar ------------
  # Saber's differentiated edge. All directed onto the target gene.
  - name: mirbind2
    kind: edge
    layer: posttx
    relation: mirna_target
    entity: gene
    loader: MiRNATargetSource
    provider: "miRBind2 (BioGeMT, bioRxiv 2026.03.19.712027)"
    url: "https://github.com/BioGeMT/miRBind_2.0"
    directed: true
    edge_attr: [repression_score]
    # miRBind2 is an INFERENCE MODEL, not a downloadable edge list: there is no
    # file to fetch. Either run the model over 3'UTR x miRNA pairs on a GPU
    # (precompute: true, which is what ops budgets for) or point
    # precomputed_predictions_url at a cached prediction table.
    precompute: true
    precomputed_predictions_url: null
    enabled: true
    notes: "Sequence-only miRNA binding + functional repression. miRNA->target edges."

  - name: targetscan
    kind: edge
    layer: posttx
    relation: mirna_target
    entity: gene
    loader: MiRNATargetSource
    provider: "TargetScan Human 8.0"
    url: "https://www.targetscan.org"
    directed: true
    edge_attr: [context_pp_score, conservation]
    enabled: false               # alternate/complement to miRBind2; nothing in the shipping path consumes an edge list yet
    entity_src: mirna_family     # the edge's SOURCE node is a TargetScan miRNA family, not a gene on the axis (PriorArtifact.src_names)
    notes: "Seed-based conserved miRNA targets. Toggle on to ensemble with mirbind2. Fetched 2026-09-25 (T102) for its per-gene 3'UTR regulatory load (MiRNATargetSource.utr_load_table); the whole Release 8.0 download streamed 2026-09-28 (T102, session 0fc42275) for the EDGE form (edge_table / build: one row per miRNA family -> gene), the per-site positions (site_table) and the 3'UTR sequence features that Saber's NAR 2016 cooperation/competition analysis needs (utr_sequence_table). All under `derived`, each with a LINEAGE.json entry."
    # ---- the fetch, through the ADR 0003 gate (sidechain.ingest.fetch.run_gate),
    # exactly as a corpus block in datasets.yaml is. TargetScan is a lab web
    # server: no record API, no listing, no checksums, no licence header. So the
    # file list below IS the listing (each name is HEAD-probed for its size and
    # Last-Modified date), the checksum absence is admitted in writing, and the
    # terms come from the FAQ quoted under license_override_source.
    host: https
    record: "https://www.targetscan.org/vert_80/vert_80_data_download"
    dest: external/targetscan-vert_80
    derived: derived/targetscan-vert_80      # utr_load.parquet + LINEAGE.json (ours)
    budget_gb: 3.5                           # 3.01 GB selected (the whole Release 8.0 download, 2026-09-28); the gate refuses a selection over this
    allow_missing_checksum: true             # the host publishes none; sha256 of what landed is in LINEAGE.json
    license: Free-for-research-with-citation
    license_override_source: >
      A web server states no terms in a header. TargetScan's Release 8 FAQ
      (targetscan.org/faqs.Release_8.html, "Are there copyright concerns?",
      read 2026-09-25) says: "You're free to use TargetScan data or code for
      your research and display TargetScan output in your presentations or
      papers, as long as you cite at least one TargetScan reference" -- the
      citation being McGeary et al. 2019 (Science) for Release 8. Recorded in
      LICENSE_POLICY as Free-for-research-with-citation (ingest/provenance.py).
    files:
      # ---- the three files of 2026-09-25 (the per-gene load) ----
      # Representative transcript per gene (Species ID 9606 rows), the transcript
      # every other file's sites are counted on. 0.62 MB.
      - name: Gene_info.txt.zip
      # Per (transcript, miRNA family): conserved and nonconserved site counts by
      # type, cumulative weighted context++ score, aggregate PCT. The default
      # predictions = conserved sites of conserved families. 10.4 MB.
      - name: Summary_Counts.default_predictions.txt.zip
      # hg19 3'UTR exon coordinates of the representative transcripts, GFF with
      # score = exon width, so a transcript's 3'UTR length is the sum of its
      # rows. 0.58 MB.
      - name: TSHuman_7_hg19_3UTRs.gff.zip
      # ---- the rest of Release 8.0, streamed 2026-09-28 (Saber: all of it) ----
      # Every table below is ALL SPECIES; the human rows (9606) are filtered on
      # read. Sizes are the zips; the text inside is 5-20x larger.
      # miRNA families: family name, seed+m8, species, miRBase id, mature
      # sequence, conservation class. 0.16 MB. The join from an individual
      # miRNA (context-score files) to its family (site and summary files).
      - name: miR_Family_Info.txt.zip
      # One row per conserved SITE of a conserved family on the representative
      # transcript: family, gene, UTR start/end (1-based, on the ungapped human
      # UTR), alignment coordinates, seed-match type, PCT. 8.3 MB. The default
      # predictions with positions -- what the edge form and the cooperation
      # features are read from.
      - name: Predicted_Targets_Info.default_predictions.txt.zip
      # The same sites keyed by individual miRNA with context++ scores, their
      # percentiles and the predicted relative KD. 17.7 MB. Human rows share the
      # file above's UTR coordinates; other species' rows sit at their own.
      - name: Predicted_Targets_Context_Scores.default_predictions.txt.zip
      # Every conserved site (any family) with context++ and KD. 18.6 MB.
      - name: Conserved_Site_Context_Scores.txt.zip
      # Every nonconserved site with context++ and KD. 542 MB zipped, 3.8 GB text.
      - name: Nonconserved_Site_Context_Scores.txt.zip
      # Conserved AND nonconserved sites of conserved families, with positions
      # and PCT. 76 MB zipped, 535 MB text. Superset of Predicted_Targets_Info.
      - name: Conserved_Family_Info.txt.zip
      # Nonconserved sites of nonconserved families. 347 MB zipped, 2.3 GB text.
      - name: Nonconserved_Family_Info.txt.zip
      # Summary counts for EVERY gene:family pair, conserved families or not.
      # 323 MB zipped, 2.4 GB text. The all-predictions edge form.
      - name: Summary_Counts.all_predictions.txt.zip
      # 3'UTR sequences from the 84-way alignments, one row per (transcript,
      # species), gapped. 795 MB zipped, over 4 GB of text. The human rows are
      # the 3'UTR sequence the cooperation features (dinucleotides, RBP motif
      # scans, distances to miRNA sites) are computed on.
      - name: UTR_Sequences.txt.zip
      # ORF sequences from the same alignments. 689 MB zipped. Not consumed by
      # any table yet; streamed because Saber asked for the whole release.
      - name: ORF_Sequences.txt.zip
      # 3P-seq tags and Affected Isoform Ratios (the APA evidence behind
      # TargetScan 7's weighted context++). 8.6 MB. Which cell lines it carries
      # is a survey question (posttx sweep, 2026-09-28).
      - name: 3Pseq_tags_AIRs.zip
      # hg19 BED of the default-prediction sites. 1.9 MB.
      - name: Predicted_Target_Locations.default_predictions.hg19.bed.zip
      # hg19 BED of all sites by conservation status. 168 MB.
      - name: All_Target_Locations.hg19.bed.zip
      # The Perl scripts that produced the tables: site finder, branch-length
      # and PCT, context++ scores. 0.04 + 0.07 + 6.6 MB. Kept so a number in
      # any table can be re-derived from its own code.
      - name: targetscan_70.zip
      - name: targetscan_70_BL_PCT.zip
      - name: TargetScan7_context_scores.zip

  - name: halflife_consensus
    kind: node_feature
    layer: posttx
    relation: mrna_halflife
    entity: gene
    loader: MRNAStabilitySource
    provider: "Agarwal & Kelley 2022, Genome Biology 23:245 (Additional file 3 = Table S2)"
    url: "https://doi.org/10.1186/s13059-022-02811-x"
    enabled: false               # a measured per-gene feature; nothing in the shipping path consumes it yet
    notes: "Measured human mRNA half-life, not a prediction. One consensus column plus the 54 per-sample columns it was summarised from; MRNAStabilitySource.halflife_table also emits a per-cell-line mean and count so the line-invariance of the feature can be tested on HEK293 and K562 before it is used as a universal prior (T102 thread 2). Gene-name overlap with the 2026 axis is 13,199 of 18,533 on an exact symbol match (research/reading/posttx-verify-10-saluki-weights-and-table-s2.md, private). The table carries NO Saluki prediction column."
    # ---- the fetch, through the ADR 0003 gate (sidechain.ingest.fetch.run_gate),
    # exactly as the targetscan block above is. Springer's static-content host is
    # a plain web server: no record API, no listing, no checksums, no licence
    # header. So the file list below IS the listing (HEAD-probed for size and
    # Last-Modified), the checksum absence is admitted in writing, and the terms
    # come from the article page quoted under license_override_source.
    host: https
    record: "https://static-content.springer.com/esm/art%3A10.1186%2Fs13059-022-02811-x/MediaObjects"
    dest: external/springer-s13059-022-02811-x
    derived: derived/halflife-agarwal-kelley-2022   # halflife.parquet + LINEAGE.json (ours)
    budget_gb: 0.05                          # 0.017 GB selected; the gate refuses a selection over this
    allow_missing_checksum: true             # the host publishes none; sha256 of what landed is in LINEAGE.json
    license: CC-BY-4.0
    license_override_source: >
      A static-file host states no terms in a header. The article's own Open
      Access statement (read 2026-09-28 on the PMC copy, PMC9684954, because
      genomebiology.biomedcentral.com 301s to link.springer.com which then 303s
      to an idp.springer.com authorize page) says: "Open Access This article is
      licensed under a Creative Commons Attribution 4.0 International License,
      which permits use, sharing, adaptation, distribution and reproduction in
      any medium or format, as long as you give appropriate credit to the
      original author(s) and the source, provide a link to the Creative Commons
      licence, and indicate if changes were made. ... To view a copy of this
      licence, visit http://creativecommons.org/licenses/by/4.0/. The Creative
      Commons Public Domain Dedication waiver
      (http://creativecommons.org/publicdomain/zero/1.0/) applies to the data
      made available in this article, unless otherwise stated in a credit line
      to the data." Additional file 3 is data made available in the article, so
      the waiver sentence reads as CC0 on this file; CC-BY-4.0 is declared here
      because it is the stricter of the two and citing the paper costs nothing.
    files:
      # Table S2: two sheets, `human` (13,921 genes) and `mouse` (14,465).
      # Sheet `human` row 1 is a note -- "The half-life (PC1) is a summary of all
      # of the datasets combined, excluding data from Gejman et al." -- and row 2
      # is the header: Ensembl Gene Id, Gene name, half-life (PC1), then 54
      # per-sample columns named <author>_<method>_<line>_<replicate>. By line
      # those are HEK293 14, K562 8, HeLa 7, H1ESC 3, MCF7 2, HepG2 1, A549 1,
      # RPE 1, plus the LCL samples PC1 leaves out. 17.2 MB.
      - name: 13059_2022_2811_MOESM3_ESM.xlsx

  - name: codon_optimality_wu2019
    kind: node_feature
    layer: posttx
    relation: codon_optimality
    entity: gene
    loader: MRNAStabilitySource
    provider: "Wu et al. 2019, eLife 8:e45396 (Figure 1 source data 1 and 2)"
    url: "https://doi.org/10.7554/eLife.45396"
    enabled: false               # a measured per-codon table turned into a per-gene score; not in the shipping path yet
    notes: "Codon stability coefficients (CSC) for the 61 sense codons in four lines by three methods, and the per-gene decay rates they were computed from. Name the lines by the paper's Methods -- 293T, HeLa, RPE, K562 -- never by its Key Resources Table, whose ATCC numbers for K562 and RPE are crossed (CCL-243 is K-562, CRL-4000 is hTERT RPE-1; research/reading/posttx-verify-08-wu2019-csc-crossline.md, private). The six CSC columns correlate 0.56-0.95 pairwise and 0.91-0.95 among the three ActD endogenous lines, but only 34 of 61 codons keep their sign across all six, so `codon_score` keeps every column and averages only the three endogenous ones into csc_endo_mean."
    # ---- the fetch, through the ADR 0003 gate, as above. eLife's CDN is a plain
    # file host: no listing, no checksums, no licence header; the terms come from
    # the eLife API's own licence field, quoted under license_override_source.
    #
    # NOTE the third input this block's codon score needs and does NOT fetch:
    # TargetScan 8.0's ORF_Sequences.txt.zip and Gene_info.txt.zip, from the
    # `targetscan` block's dest (external/targetscan-vert_80/). The CSC table is
    # per codon; turning it into a per-gene score needs each gene's ORF, and
    # TargetScan already publishes one per representative transcript on the same
    # transcript the miRNA tables are counted on. Those two names are already in
    # the targetscan block's `files:` -- do not add them here, or two blocks would
    # claim the same bytes and PROVENANCE.json would disagree with itself.
    host: https
    record: "https://cdn.elifesciences.org/articles/45396"
    dest: external/elife-45396
    derived: derived/codon-optimality-wu2019   # codon_score.parquet, decay_rates.parquet + LINEAGE.json (ours)
    budget_gb: 0.02                          # 0.006 GB selected; the gate refuses a selection over this
    allow_missing_checksum: true             # the host publishes none; sha256 of what landed is in LINEAGE.json
    license: CC-BY-4.0
    license_override_source: >
      A CDN states no terms in a header. https://api.elifesciences.org/articles/45396
      (read 2026-09-28) returns "copyright": {"license": "CC-BY-4.0", "holder":
      "Wu et al.", "statement": "This article is distributed under the terms of
      the Creative Commons Attribution License, which permits unrestricted use
      and redistribution provided that the original author and source are
      credited."}. The source-data files are published as part of that article.
    files:
      # Figure 1 source data 2: the per-codon table. 61 codons x 6 CSC columns
      # (293T_endo, HeLa_endo, RPE_endo, 293T_ORFome, K562_ORFome, K562_SLAM),
      # plus genome and transcriptome codon counts. 6.2 kB.
      - name: elife-45396-fig1-data2-v2.csv
      # Figure 1 source data 1: per-gene decay rates, six sheets. Four are keyed
      # by Ensembl gene id -- 293T-endogenous (13,187 genes), HeLa-endogenous
      # (12,152), RPE-endogenous (11,974), k562-SLAM-seq (8,861) -- and two,
      # 293T-ORFome and k562-ORFome, are keyed by a 24-nt library barcode with no
      # gene id, so they need the TRC3 ORF barcode map before they can be read.
      # The sign convention differs between sheets (SLAM-seq median -0.12, 293T
      # endogenous +0.012): `decay_table` keeps the raw values and records each
      # sheet's median rather than standardising silently. 5.6 MB.
      - name: elife-45396-fig1-data1-v2.xlsx

  - name: polyasite_2
    kind: node_feature
    layer: posttx
    relation: polyadenylation_layout
    entity: gene
    loader: PolyASiteSource
    provider: "PolyASite 2.0, human atlas on GRCh38 / Ensembl 96 (Herrmann et al. 2020, NAR 48:D174)"
    url: "https://polyasite.unibas.ch/atlas"
    enabled: false               # a per-gene node feature; nothing in the shipping path consumes it yet (T102, T120)
    notes: "One row per gene: the distance from the representative transcript's last splice acceptor to its first supported poly(A) site (Borzoi Prime's strongest differential-polyadenylation cue, research/reading/linder-2025-borzoi-prime.md measurement 6, private), the number of supported sites in the gene's 3' window, the short and long 3'UTR lengths, the proximal site's pooled usage and poly(A) signal, intronic sites. Clusters are assigned to genes by a strand-aware window on GENCODE v47 (the gencode_v47_basic block below), never by the atlas's own gene column. The atlas is HeLa- and HEK293-heavy (221 libraries); the per-line usage columns it also yields are written and used nowhere (plans/2026-10-15-t102-polyasite.md, private)."
    # ---- the gate, as the targetscan block above, on a plain web server (no record
    # API, no listing, no checksum, no licence header). The file list IS the listing.
    # A download: the terms are stated nowhere (license_override_source below), and
    # since the ADR 0003 amendment of 2026-10-15 (Saber: these datasets are reused and
    # hold valuable information, and re-streaming them loses time to interruptions) an
    # UNSTATED source may be HELD when the block names the citation we give it wherever
    # it is used -- `citation:` below, which the gate requires on this route and writes
    # into PROVENANCE.json. Publication is where the terms are re-evaluated or the
    # Zavolan lab asked; the value, the override source and both encumbrance flags stay
    # on everything derived so that re-evaluation is triggered. The block streamed until
    # 2026-10-15 (posttx_mirna.stream_gated_file; the first build's LINEAGE entry says so),
    # and PolyASiteSource still reads a block either way.
    host: https
    record: "https://polyasite.unibas.ch/download/atlas/2.0/GRCh38.96"
    dest: external/polyasite-2.0
    derived: derived/polyasite-2.0           # pas_gene_features.parquet + LINEAGE.json (ours)
    budget_gb: 0.1                           # 0.051 GB selected; the gate refuses a selection over this
    allow_missing_checksum: true             # the host publishes none; sha256 of what landed is in LINEAGE.json
    license: UNSTATED
    citation: "Herrmann CJ, Schmidt R, Kanitz A, Artimo P, Gruber AJ, Zavolan M (2020). PolyASite 2.0: a consolidated atlas of polyadenylation sites from 3' end sequencing. Nucleic Acids Research 48(D1):D174-D179, doi:10.1093/nar/gkz918"
    license_override_source: >
      The atlas states no terms anywhere the publisher controls. Checked
      2026-10-15 (twice, by sessions 7ff4968d and a0ea7064): the site root,
      /atlas, /atlas_sc, /samples and /about carry only the footer
      "© 2015-2026 University of Basel"; /about asks "If you use PolyASite in
      your research, please cite the following publications:" (v2.0: Herrmann
      et al., NAR 48:D174-D179, 2020). The paper's own licence (Europe PMC
      PMC7145510: "Creative Commons Attribution Non-Commercial License") governs
      the article, not the atlas, as scBaseCount's preprint footer did not govern
      its bucket; the pipeline repo (zavolanlab/polyAsite_workflow) is Apache-2.0
      and covers the code only. What sanctions the use is the public bulk
      download the authors offer and the citation request. So the value is
      UNSTATED, recorded with both encumbrance flags; publishing anything built
      from it needs a fresh call. Saber, 2026-10-15, first: stream it, licence
      recorded as unstated; later the same day, the ADR 0003 amendment: a cited
      UNSTATED source may be downloaded, re-evaluated at publication.
    files:
      # The "Atlas with Samples" TSV: one row per poly(A)-site cluster (569,005),
      # thirteen fixed columns (chrom, start, end, cluster id, mean TPM, strand,
      # representative site, share of samples supporting, number of protocols,
      # annotation code TE/EX/IN/DS/AE/AI/AU/IG, gene symbols, Ensembl gene ids,
      # PAS motifs in -60..+10) and then one TPM column per library, headed
      # SAMPLE_ID|PROTOCOL|SOURCE|TITLE|TREATMENT (221 libraries). 50.6 MB gzipped,
      # Last-Modified 2020-04-22. The BED twin has no gene column, so the TSV it is.
      - name: atlas.clusters.2.0.GRCh38.96.tsv.gz

  - name: gencode_v47_basic
    kind: node_feature
    layer: cis
    relation: transcript_structure
    entity: gene
    loader: PolyASiteSource
    provider: "GENCODE release 47 (Ensembl 113), basic gene annotation, GRCh38"
    url: "https://www.gencodegenes.org/human/release_47.html"
    enabled: false               # an annotation the polyasite_2 block reads; not a prior in the shipping path (T102, T120)
