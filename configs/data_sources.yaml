    license: NCBI-no-restrictions
    license_override_source: >
      The GEO record of GSE49831 states no licence, on the series or on its samples
      (read 2026-10-16, session f6ea03ac, the text view of acc.cgi). The terms recorded
      are the host's own policy for its molecular databases, gene expression named among
      them: "NCBI itself places no restrictions on the use or distribution of the data
      contained therein. Nor do we accept data when the submitter has requested
      restrictions on reuse or redistribution" (ncbi.nlm.nih.gov/home/about/policies/,
      re-read 2026-10-16). The same paragraph adds that a submitter may still claim
      rights NCBI cannot assess or transfer; the depositors' own statement is the
      paper's accession line (Genome Biology 15:R15, PMC4056462), which names GSE49831
