    layer: posttx
    relation: mirna_abundance_line
    entity: gene
    loader: MiRNAAbundanceSource
    provider: "miRNATissueAtlas 2025 (Rishik et al., NAR 53:D129): harmonised public small-RNA-seq, 46,997 human samples, 132 cell-line labels, miRBase 22.1, reads per million mapped"
    url: "https://doi.org/10.1093/nar/gkae1036"
    enabled: false               # a per-gene node feature; nothing in the shipping path consumes it yet (T120)
    notes: >-
      The one source with HeLa (282 cell-line samples, the line context B reads as) and HEK293 (597, HEK293T folded in);
      also K562 97, HCT116 239, HepG2 92, Jurkat 16; no CAL-33, RPE1 or H1 (private research/reading/posttx-verify-23,
      -31). Every public run is pooled, "including conditions such as disease, knock-out, overexpression experiments",
      so a line's value here is the MEDIAN over its samples, a repertoire rather than a baseline. The h5ad's obs carry the
      label column `Tissue` and `Biotype`; var are miRBase 22.1 mature names.
    host: https
    record: "https://web.ccb.uni-saarland.de/mirnatissueatlas_2025"
    dest: external/mirnatissueatlas-2025
    derived: derived/mirnatissueatlas-2025           # mirna_family_abundance.parquet, mirna_load.parquet + LINEAGE.json (ours)
    budget_gb: 1.2                                   # 1.0 GB selected
    allow_missing_checksum: true                     # the site publishes none; sha256 of what landed is in LINEAGE.json
    license: UNSTATED
    license_override_source: >
      Terms are stated nowhere the publisher controls (the Verifier, 2026-10-17, private
      research/reading/posttx-verify-31): the home, downloads, tutorial, tissues, specificity,
      patterns and general_info pages carry no licence, terms-of-use or reuse statement, the
      /terms/, /about/ and /help/ paths return 404, the footer's Legal Notice is the university's
      generic notice, and the paper's Data availability says only "All data are available through
      the miRNATissueAtlas 2025 web repository". The home page says "This website is free and
      open to all users and there is no login requirement"; the 2021 atlas's abstract said its
      resource "is available online without any restrictions" (NAR 2022, gkab808). The paper's
      CC BY 4.0 covers the article, not the matrices. So UNSTATED, with both encumbrance flags and
      the citation below, held under the ADR 0003 amendment of 2026-10-15 (a cited source with
      unstated terms may be downloaded; publication is where the terms are re-evaluated or the
      Chair for Clinical Bioinformatics asked).
    citation: "Rishik S, Hirsch P, Grandke F, Fehlmann T, Keller A (2025). miRNATissueAtlas 2025: an update to the uniformly processed and annotated human and mouse non-coding RNA tissue atlas. Nucleic Acids Research 53(D1):D129-D137, doi:10.1093/nar/gkae1036"
    files:
      # The download endpoints name no file; each entry carries its url and the name the server gives.
      - name: all_human_miRNA_rpmm_harmonized_meta_data.h5ad
        url: "https://web.ccb.uni-saarland.de/mirnatissueatlas_2025/download_file/mirna_expression_human/"
      - name: meta_data_human.parquet
