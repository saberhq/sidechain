# ============================================================================
# Sidechain corpus registry: one block per external dataset, read by the
# ingest gate (`sidechain.ingest.fetch`) and the `sidechain.data.stream_*`
# readers. Priors are registered in data_sources.yaml. A block is retired with
# `enabled: false`, never deleted.
#
# Every block declares:
#   host / record   where the bytes come from, pinned: zenodo (a version id,
#                   never the concept DOI), figshare (`<id>.v<n>`), huggingface,
#                   lamin, s3 (`<bucket>[/<prefix>]`) or https (a directory URL;
#                   `files` is its listing, each name HEAD-probed).
#   license         the SPDX id the host publishes; the gate re-checks it.
#                   lamin, s3 and https state no terms, so they pass only with
#                   `license_override_source`, which PROVENANCE.json records.
#                   `UNSTATED` passes only that way, and on route: download only
#                   with `citation:`.
#   budget_gb       a ceiling in GB: on the selected files for route: download,
#                   on what we write for route: stream.
#   dest            the external/ directory for the bytes and PROVENANCE.json.
#   files           an explicit list or a glob; a missing name or a glob that
#                   matches nothing raises.
#
# Optional:
#   route           `download` (default) or `stream`; any other value is
#                   refused. A streamed corpus never lands: `dest` holds only
#                   PROVENANCE.json.
#   derived         where a stream writes its outputs (derived/<source>/).
#   allow_missing_checksum   admit files the host publishes no digest for.
#   citation        the paper cited wherever the source is used.
#   notes           a short description of the dataset.
#
# Per file, `kind` (default `expression`) sets the required `spec` keys:
#   expression       counts: context, pert_col, control_label, modality, role.
#   lfc_table        a precomputed contrast, no control arm: target_col,
#                    gene_id_col, effect_col, pvalue_col, modality, role.
#   gene_map         a token -> gene table: role.
#   cell_metadata    a per-cell obs sidecar: role.
#   sample_metadata  a per-experiment table: role.
#   observational    unlabelled counts: context, context_col, sample_from,
#                    sample_id_col, assay, content_filter, role; pert_col and
#                    control_label are forbidden.
#
# A spec names its context once: `context:` for the whole file or
# `context_col:` per row, the other null. `control_label` may be a list; every
# entry must match a label. `role` is train, analysis, reference, excluded or
# prior. Other spec keys are read by the reader that streams the file.
#
# Notes: private/code-notes/configs/datasets.yaml.md
# ============================================================================

datasets:

  - name: scperturb_multicontext
    enabled: true
    host: zenodo
    record: "13350497"           # scPerturb v1.4
    license: CC-BY-4.0
    budget_gb: 20.0
    dest: external/zenodo-13350497
    notes: >
      scPerturb's harmonized screens: Replogle 2022 (K562 genome-wide and
      essential, RPE1), Nadig 2024 (Jurkat, HepG2) and Wessels 2023 (THP-1).

    files:
      - name: ReplogleWeissman2022_K562_gwps.h5ad
        spec: {context: k562, pert_col: perturbation, control_label: control,
               gene_id_col: ensembl_id, modality: crispri, role: train}
      - name: ReplogleWeissman2022_K562_essential.h5ad
        spec: {context: k562, pert_col: perturbation, control_label: control,
               gene_id_col: ensembl_id, modality: crispri, role: train}
      - name: ReplogleWeissman2022_rpe1.h5ad
        spec: {context: rpe1, pert_col: perturbation, control_label: control,
               gene_id_col: ensembl_id, modality: crispri, role: train}
      - name: NadigOConner2024_jurkat.h5ad
        spec: {context: jurkat, pert_col: perturbation, control_label: control,
               gene_id_col: ensembl_id, modality: crispri, role: train}
      - name: NadigOConner2024_hepg2.h5ad
        spec: {context: hepg2, pert_col: perturbation, control_label: control,
               gene_id_col: ensembl_id, modality: crispri, role: train}

      # Cas13 knockdowns; var_names are symbols, so gene_id_col is null.
      - name: WesselsSatija2023.h5ad
        spec: {context: thp1, pert_col: perturbation, control_label: control,
               gene_id_col: null, modality: cas13, role: excluded}

  - name: xatlas_orion
    enabled: true
    host: huggingface
    record: "Xaira-Therapeutics/X-Atlas-Orion"
    license: CC-BY-NC-SA-4.0
    route: stream
    budget_gb: 20.0
    dest: external/hf-Xaira-Therapeutics-X-Atlas-Orion   # PROVENANCE.json only
    derived: derived/xatlas-orion                        # aggregates + LINEAGE.json
    notes: >
      X-Atlas/Orion (Huang et al. 2025): genome-wide CRISPRi in HCT116 and
      HEK293T, one parquet per batch, read by sidechain.data.stream_parquet_pseudobulk.

    files:
      - name: "data/HCT116_*.parquet"
        kind: expression
        spec: {context: hct116, pert_col: gene_target, control_label: Non-Targeting,
               gene_id_col: ensembl_id, modality: crispri, role: train,
               granularity: pseudobulk, batch_col: sample}
      - name: "data/HEK293T_*.parquet"
        kind: expression
        spec: {context: hek293t, pert_col: gene_target, control_label: Non-Targeting,
               gene_id_col: ensembl_id, modality: crispri, role: train,
               granularity: pseudobulk, batch_col: sample}

      # The table `gene_token_id` indexes; the streaming reader fetches it.
      - name: metadata/gene_metadata.parquet
        kind: gene_map
        spec: {role: reference, id_cols: [gene_token_id, ensembl_id, gene_name]}

  - name: xatlas_orion_guide_calls
    enabled: true
    host: figshare
    record: "29190726.v3"
    license: CC-BY-NC-SA-4.0
    budget_gb: 0.25
    dest: external/figshare-29190726
    notes: >
      X-Atlas/Orion's per-cell dual-guide calls with each guide's UMI count,
      keyed on `cell_barcode` (`<10x barcode>-<sample>`).

    files:
      - name: HCT116_filtered_guide_calls_per_cell.csv.gz
        kind: cell_metadata
        spec: {role: reference}
      - name: HEK293T_filtered_guide_calls_per_cell.csv.gz
        kind: cell_metadata
        spec: {role: reference}

  - name: pertdata_sunshine23
    enabled: true
    host: lamin
    record: "laminlabs/pertdata"
    license: CC-BY-4.0
    license_override_source: >
      scPerturb Zenodo record 13350497 v1.4 declares CC-BY-4.0 and its file
      list includes SunshineHein2023.h5ad (verified at the 2026-08-16 ingest,
      external/zenodo-13350497/PROVENANCE.json); the pertdata scperturb/ tree
      is Lamin's curated re-annotation of that corpus. Lamin metadata itself
      cannot state a license (2026-08-27 enumeration).
    route: stream
    budget_gb: 1.0
    dest: external/lamin-laminlabs-pertdata      # PROVENANCE.json only
    derived: derived/lamin-pertdata              # aggregates + per-artifact .lineage.json
    notes: >
      Sunshine et al. 2023: CRISPRi in SARS-CoV-2-infected Calu-3 cells, from
      Lamin's scPerturb re-annotation; read by sidechain.data.stream_lamindb_pseudobulk.
    files:
      - name: scperturb/sunshine23/X.h5ad
        kind: expression
        spec: {context: calu3, context_col: null, pert_col: pert_target_multi,
               control_label: control, gene_id_col: ensembl_id,
               modality: crispri, role: train, granularity: cell}
      - name: scperturb/sunshine23/obs.parquet
        kind: cell_metadata
        spec: {role: reference}
      - name: scperturb/sunshine23/var.parquet
        kind: gene_map
        spec: {role: reference, id_cols: [ensembl_id, symbol]}

  - name: perturbench_mcfaline23
    enabled: true
    host: lamin
    record: "altoslabs/perturbench"
    license: CC-BY-4.0
    license_override_source: >
      huggingface.co/datasets/altoslabs/perturbench declares cc-by-4.0 (HF API
      cardData.license, verified 2026-08-27); the lamin instance's processed
      h5ads are the same project's artifacts, mirrored on that HF repo. Lamin
      metadata itself cannot state a license (2026-08-27 enumeration).
    route: stream
    budget_gb: 1.0
    dest: external/lamin-altoslabs-perturbench   # PROVENANCE.json only
    derived: derived/lamin-perturbench           # aggregates + per-artifact .lineage.json
    notes: >
      McFaline-Figueroa et al. 2023 (sci-Plex-GxE): a CRISPRi kinome screen in
      three glioblastoma lines, pooled as one context; raw counts in layers/counts.
    files:
      - name: mcfaline23_gxe_processed.h5ad
        kind: expression
        spec: {context: gbm_pooled, context_col: null, pert_col: gene_id,
               control_label: control, gene_id_col: null,
               modality: crispri, role: train, granularity: cell}

  - name: feng_2026_lfc
    enabled: true
    host: figshare
    record: "26819743.v1"
    license: MIT
    budget_gb: 3.8
    dest: external/figshare-26819743
    notes: >
      Feng et al. 2026 (Cell Genomics 6:101076): genome-scale CRISPRi across
      human iPSC lines; the published per-gene log fold changes.

    files:
      # One pooled context. Columns: Target, Expressed_Gene_Symbol,
      # Expressed_Gene_Ens_ID, lfc, pval_adj.
      - name: GenomeWideScreen_LFC_byGene.tsv.gz
        kind: lfc_table
        spec: {context: ipsc_pooled, context_col: null, target_col: Target,
               gene_id_col: Expressed_Gene_Ens_ID, gene_symbol_col: Expressed_Gene_Symbol,
               effect_col: lfc, pvalue_col: pval_adj, pvalue_adjusted: true,
               modality: crispri, role: train}

      # The targeted arm, per line: adds `Cell_Line` and `wt_expr` (baseline
      # expression).
      - name: TargetedScreen_LFC_byGene-perLine.tsv.gz
        kind: lfc_table
        spec: {context: null, context_col: Cell_Line, target_col: Target,
               gene_id_col: Expressed_Gene_Ens_ID, gene_symbol_col: Expressed_Gene_Symbol,
               effect_col: lfc, pvalue_col: pval_adj, pvalue_adjusted: true,
               baseline_expr_col: wt_expr, modality: crispri, role: analysis}

  - name: feng_2026_counts
    enabled: true
    host: figshare
    record: "27989294.v2"
    license: MIT
    budget_gb: 11.0
    dest: external/figshare-27989294
    notes: >
      Feng et al. 2026's raw UMI counts, genes x cells as dense CSV, with the
      per-cell metadata and guide counts. The control arm is the paper's:
      cells with no guide (`unassigned`) or a non-targeting one.

    files:
      # The genome-wide arm's fitness-gene pool.
      - name: GenomeWideScreen_FitnessGenes_RNA-UMI-Counts.csv.gz
        kind: expression
        spec: {context: null, context_col: Cell_Line, pert_col: Guide_Call,
               pert_label_from: guide_call_prefix,
               control_label: [NonTarget, unassigned],
               obs_from: GenomeWideScreen_FitnessGenes_Cell-Metadata.tsv.gz,
               cell_id_col: Cell_ID, batch_col: Batch, orientation: genes_by_cells,
               gene_id_col: null, counts_are_raw: true, granularity: cell,
               modality: crispri, role: analysis}

      # The genome-wide arm's non-fitness pool.
      - name: GenomeWideScreen_NonFitnessGenes_RNA-UMI-Counts.csv.gz
        kind: expression
        spec: {context: null, context_col: Cell_Line, pert_col: Guide_Call,
               pert_label_from: guide_call_prefix,
               control_label: [NonTarget, unassigned],
               obs_from: GenomeWideScreen_NonFitnessGenes_Cell-Metadata.tsv.gz,
               cell_id_col: Cell_ID, batch_col: Batch, orientation: genes_by_cells,
               gene_id_col: null, counts_are_raw: true, granularity: cell,
               modality: crispri, role: analysis}

      # Per-cell metadata: Cell_ID, Batch, Guide_Call, Cell_Line.
      - name: GenomeWideScreen_FitnessGenes_Cell-Metadata.tsv.gz
        kind: cell_metadata
        spec: {role: reference}
      - name: GenomeWideScreen_NonFitnessGenes_Cell-Metadata.tsv.gz
        kind: cell_metadata
        spec: {role: reference}

      # Guide UMI counts behind `Guide_Call`, guides x cells.
      - name: GenomeWideScreen_FitnessGenes_Guide-UMI-Counts.csv.gz
        kind: cell_metadata
        spec: {role: reference}
      - name: GenomeWideScreen_NonFitnessGenes_Guide-UMI-Counts.csv.gz
        kind: cell_metadata
        spec: {role: reference}

      # The targeted arm.
      - name: TargetedScreen_RNA-UMI-Counts.csv.gz
        kind: expression
        spec: {context: null, context_col: Cell_Line, pert_col: Guide_Call,
               pert_label_from: guide_call_prefix,
               control_label: [NonTarget, unassigned],
               obs_from: TargetedScreen_Cell-Metadata.tsv.gz,
               cell_id_col: Cell_ID, batch_col: Batch, orientation: genes_by_cells,
               gene_id_col: null, counts_are_raw: true, granularity: cell,
               modality: crispri, role: analysis}

      - name: TargetedScreen_Cell-Metadata.tsv.gz
        kind: cell_metadata
        spec: {role: reference}
      - name: TargetedScreen_Guide-UMI-Counts.csv.gz
        kind: cell_metadata
        spec: {role: reference}

  - name: scbasecount_human_gene
    enabled: true
    host: lamin                  # the registry probed; the bytes are on GCS over anonymous HTTPS
    record: "laminlabs/arc-virtual-cell-atlas"
    license: UNSTATED
    license_override_source: >
      No data licence is stated in any Arc-controlled source. Checked
      2026-08-28 and each came back empty: the atlas repository's README,
      scBaseCount/README.md, arcinstitute.org/tools/virtualcellatlas, the
      bucket's own object metadata, and the preprint's data-availability
      section; there is no LICENSE file at the repo root (404). The "CC0 1.0"
      that surfaces in every web search is bioRxiv's PREPRINT-licence footer,
      which governs the manuscript, not the data. Lamin cannot supply terms
      either: no field on the Artifact model carries them (2026-08-27
      enumeration). What stands in its place is the publisher's sanction:
      Arc's own VCC-2026 datasets page names scBaseCount in its list of
      recommended public training data, and Arc runs the competition we are
      entering. The underlying content is re-quantified public SRA
      submissions, which carry no redistribution restriction from NCBI. So the
      recorded position is: terms unstated, this use sanctioned by the
      publisher, and we redistribute nothing -- route: stream, so no corpus
      byte ever lands. Publishing any derived artifact is a separate decision
      and the encumbrance flags in PROVENANCE.json are set to force one.
    route: stream
    budget_gb: 2.5
    dest: external/lamin-laminlabs-arc-virtual-cell-atlas   # PROVENANCE.json only
    derived: derived/scbasecount                            # aggregates + LINEAGE.json
    notes: >
      scBaseCount (Youngblut et al., bioRxiv 10.1101/2025.02.27.640494): SRA
      10x runs re-quantified through one STARsolo pipeline; human, Gene mode,
      release 2026-01-12. No per-cell perturbation label; read by
      sidechain.data.stream_observational.

    files:
      # One h5ad per SRA experiment; content_filter narrows what the reader opens.
      - name: "scbasecount/2026-01-12/h5ad/Gene/Homo_sapiens/*.h5ad"
        kind: observational
        spec: {context: null, context_col: cell_line,
               sample_from: scbasecount/2026-01-12/metadata/Gene/Homo_sapiens/sample_metadata.parquet,
               sample_id_col: srx_accession, obs_sample_col: SRX_accession,
               assay: 10x_3prime_gex_single_cell,
               content_filter: {min_bytes_per_cell: 500,
                                min_umi_per_cell: 1000,
                                cell_prep: [single_cell],
                                tech_10x: [3_prime_gex]},
               gene_id_col: null, gene_symbol_col: gene_symbols,
               counts_are_raw: true, granularity: cell, role: prior}

      # The per-experiment manifest: cell line, assay and the filter's inputs.
      - name: scbasecount/2026-01-12/metadata/Gene/Homo_sapiens/sample_metadata.parquet
        kind: sample_metadata
        spec: {role: reference}

  - name: gwcd4i_de
    enabled: true
    host: s3
    record: "genome-scale-tcell-perturb-seq/marson2025_data/"
    license: MIT
    license_override_source: >
      The CZI Virtual Cells Platform dataset card,
      https://virtualcellmodels.cziscience.com/dataset/genome-scale-tcell-perturb-seq,
      states License "MIT License" linking opensource.org/licenses/MIT, and names
      no registration, embargo or click-through (verified 2026-09-15 and again
      2026-09-21). It is the publisher's own page for exactly this bucket. The
      S3 listing itself can state no terms.
    route: stream
    budget_gb: 1.5
    allow_missing_checksum: true   # the DE file's ETag is multipart, not a digest
    dest: external/s3-genome-scale-tcell-perturb-seq-marson2025_data   # PROVENANCE.json only
    derived: derived/gwcd4i                                            # aggregates + .lineage.json
    notes: >
      GWCD4i (Zhu et al., bioRxiv 10.64898/2025.12.23.696273; Cell
      10.1016/j.cell.2026.08.002): genome-scale CRISPRi Perturb-seq in primary
      human CD4+ T cells, 4 donors, 3 culture conditions. The publisher's DE
      tables, range-read by sidechain.data.stream_de_h5ad.
    files:
      # The DE fits: a row per (target, condition), log_fc and lfcSE layers.
      - name: GWCD4i.DE_stats.h5ad
        kind: lfc_table
        spec: {context: cd4_tcell, context_col: null,
               target_col: target_contrast_gene_name, condition_col: culture_condition,
               gene_id_col: gene_ids, gene_symbol_col: gene_name,
               effect_col: log_fc, se_col: lfcSE,
               pvalue_col: adj_p_value, pvalue_adjusted: true,
               modality: crispri, role: train}
      # The same fits per pair of donors and per guide, under `mod/<name>/`.
      - name: GWCD4i.DE_stats.by_donors.h5mu
        kind: lfc_table
        spec: {context: cd4_tcell, context_col: null,
               target_col: target_contrast_gene_name, condition_col: culture_condition,
               gene_id_col: gene_ids, gene_symbol_col: gene_name,
               effect_col: log_fc, se_col: lfcSE,
               pvalue_col: adj_p_value, pvalue_adjusted: true,
               modality: crispri, role: analysis}
      - name: GWCD4i.DE_stats.by_guide.h5mu
        kind: lfc_table
        spec: {context: cd4_tcell, context_col: null,
               target_col: target_contrast_gene_name, condition_col: culture_condition,
               gene_id_col: gene_ids, gene_symbol_col: gene_name,
               effect_col: log_fc, se_col: lfcSE,
               pvalue_col: adj_p_value, pvalue_adjusted: true,
               modality: crispri, role: analysis}
      # The publisher's supplementary tables: per-fit replicate summaries,
      # regulator clusters, per-sgRNA tables, and the bucket's data dictionary.
      - name: suppl_tables/DE_stats.suppl_table.csv
        kind: sample_metadata
        spec: {role: analysis}
      - name: suppl_tables/clustering_results_and_annotations.csv
        kind: sample_metadata
        spec: {role: analysis}
      - name: suppl_tables/guide_kd_efficiency.suppl_table.csv
        kind: sample_metadata
        spec: {role: analysis}
      - name: suppl_tables/guide_offtarget_analysis_results.csv
        kind: sample_metadata
        spec: {role: analysis}
      - name: suppl_tables/sgrna_library_metadata.suppl_table.csv
        kind: sample_metadata
        spec: {role: analysis}
      - name: data_sharing_readme.md
        kind: sample_metadata
        spec: {role: analysis}
      # Pseudobulks per (sgRNA, donor, condition), CSR, range-read by `indptr`;
      # controls are the `NTC` rows.
      - name: GWCD4i.pseudobulk_merged.h5ad
        kind: expression
        spec: {context: cd4_tcell, pert_col: perturbed_gene_name, control_label: [NTC],
               gene_id_col: gene_ids, modality: crispri, role: analysis,
               granularity: pseudobulk, batch_col: donor_id}

  # Pan et al. 2026 (bioRxiv 10.64898/2026.05.16.725005): CRISPRi Perturb-seq in
  # H1 hESC, GEO GSE295214, one Cell Ranger h5 per lane. The h5 has no obs
  # table: sidechain.data.stream_10x_h5 calls each cell's guide from the
  # guide-capture rows by the spec's rules (min_genes, guide_min_umi,
  # guide_rule, guide_target_regex, control_guide_regex, n_control_guides), and
  # `pert_col` names a column of the reader's per-cell table.
  - name: pan2026_h1_crispri
    enabled: true
    host: https
    record: "https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM8943nnn"   # GSM8943000-999
    license: NCBI-no-restrictions
    license_override_source: >
      The GEO record of GSE295214 states no licence, on the series or on the
      samples (read 2026-10-05 and again 2026-10-09). The terms recorded are
      the host's own policy for its molecular databases, gene expression named
      among them: "NCBI itself places no restrictions on the use or
      distribution of the data contained therein. Nor do we accept data when
      the submitter has requested restrictions on reuse or redistribution"
      (https://www.ncbi.nlm.nih.gov/home/about/policies/, read 2026-10-09). The
      same paragraph adds that a submitter may still claim rights NCBI cannot
      assess or transfer; the depositors' own statement on this screen is
      their paper's Data availability line, which names the accession and
      states no terms (Pan, Saunders et al., bioRxiv 10.64898/2026.05.16.725005
      v1). That paper's CC-BY 4.0 footer covers the manuscript and is NOT the
      basis of this record. A web server header can state no terms.
    allow_missing_checksum: true
    budget_gb: 12.0
    dest: external/geo-GSE295214
    derived: derived/pan2026-h1   # pseudobulks, the per-cell table, the QC sidecar + LINEAGE.json
    notes: >
      Pan et al. 2026's H1 hESC CRISPRi screen: 85 lanes, 10x 5' with direct
      guide capture, read one lane at a time by sidechain.data.stream_10x_h5.

    files:
      # One spec for all 85 lanes (the `&pan2026_lane` anchor).
      - name: GSM8943713/suppl/GSM8943713_jan_10_GEX_A7_sg_H6_filtered_feature_bc_matrix.h5
        spec: &pan2026_lane
          context: h1
          pert_col: target_gene            # derived by the reader from the guide rules
          control_label: non-targeting
          gene_id_col: id                  # matrix/features/id is the Ensembl id; `name` the symbol
          modality: crispri
          role: train
          granularity: cell
          batch_col: lane                  # the GEO sample
          expression_feature_type: "Gene Expression"
          guide_feature_type: "CRISPR Guide Capture"
          min_genes: 500
          guide_min_umi: 20
          guide_rule: exactly_one
          guide_target_regex: '^(?P<target>.+)_[+-]_\d+\.\d+-.+$'
          control_guide_regex: '^non-targeting_\d+$'
          n_control_guides: 370
      - name: GSM8943714/suppl/GSM8943714_jan_10_GEX_B7_sg_G6_filtered_feature_bc_matrix.h5
        spec: *pan2026_lane
      - name: GSM8943715/suppl/GSM8943715_jan_10_GEX_C7_sg_F6_filtered_feature_bc_matrix.h5
        spec: *pan2026_lane
      - name: GSM8943716/suppl/GSM8943716_jan_10_GEX_D7_sg_E6_filtered_feature_bc_matrix.h5
        spec: *pan2026_lane
      - name: GSM8943717/suppl/GSM8943717_jan_10_GEX_E7_sg_D6_filtered_feature_bc_matrix.h5
        spec: *pan2026_lane
      - name: GSM8943718/suppl/GSM8943718_jan_10_GEX_G7_sg_B6_filtered_feature_bc_matrix.h5
        spec: *pan2026_lane
      - name: GSM8943719/suppl/GSM8943719_jan_10_GEX_H7_sg_A6_filtered_feature_bc_matrix.h5
        spec: *pan2026_lane
      - name: GSM8943720/suppl/GSM8943720_jan_12_GEX_A8_sg_H5_filtered_feature_bc_matrix.h5
        spec: *pan2026_lane
      - name: GSM8943721/suppl/GSM8943721_jan_12_GEX_B8_sg_G5_filtered_feature_bc_matrix.h5
        spec: *pan2026_lane
      - name: GSM8943722/suppl/GSM8943722_jan_12_GEX_C8_sg_F5_filtered_feature_bc_matrix.h5
        spec: *pan2026_lane
      - name: GSM8943723/suppl/GSM8943723_jan_12_GEX_D8_sg_E5_filtered_feature_bc_matrix.h5
        spec: *pan2026_lane
