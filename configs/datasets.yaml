# ============================================================================
# Sidechain external-dataset registry.
#
# The sibling of data_sources.yaml: that one registers *priors*, this one
# registers *corpora*. Same principle -- adding a dataset appends a block and
# shelves with `enabled: false` rather than deletion, so an ingest can be
# reproduced, audited or retired without editing code.
#
# Every block MUST declare:
#   host / record       where it comes from, pinned. Zenodo record ids pin a
#                       VERSION; the concept DOI resolves to "latest" and would
#                       change under us, so we never fetch by concept DOI.
#   budget_gb           the ceiling this dataset is allowed to occupy. The gate
#                       refuses a selection that exceeds it, so a fetch can
#                       never decide for itself how much disk it takes.
#                       HOW TO PICK IT: it is a tripwire against the record
#                       GROWING upstream, not an estimate of free disk -- the
#                       gate checks real free space separately. Set it ~40%
#                       above the known selection: loose enough that a point
#                       release adding a file does not hard-stop the run, tight
#                       enough that a record which doubled still does.
#   files               explicit list, or a glob. Selection is strict either
#                       way: a name not in the record raises, and a glob that
#                       matches NOTHING raises, because a silently partial
#                       corpus looks complete.
#
# Optional, and each one defaults to the pre-streaming behaviour so every block
# written before they existed stays true:
#   route               `download` (default) or `stream`. This changes what
#                       budget_gb is measured against -- see below. An
#                       unrecognised value is refused, never treated as
#                       `download`, because that typo would put a 126 GB
#                       corpus on a laptop.
#   derived             where OUR computed artifacts go, when route is stream.
#                       Separate tree from `dest` on purpose: external/ is
#                       someone else's immutable bytes (always safe to delete,
#                       re-downloadable), derived/ is ours and expensive (hours
#                       of network to rebuild). ADR 0003 §1.
#   kind                per file, defaulting to `expression`. It selects which
#                       spec keys are REQUIRED, so it exists to stop a file
#                       being asked a question it cannot answer. Declared
#                       rather than guessed from the filename, same as `kind:`
#                       on a prior source in data_sources.yaml.
#                         expression     per-cell or pseudobulk counts. Needs
#                                        context, pert_col, control_label,
#                                        modality, role.
#                         gene_map       a token->gene lookup table. Not
#                                        perturbation data and cannot answer
#                                        "what is the control label", so it
#                                        carries `role` and nothing else.
#                         lfc_table      a PRECOMPUTED per-gene contrast. The
#                                        control arm was already divided out
#                                        upstream, so `control_label` is not
#                                        merely absent but meaningless, and
#                                        declaring one would be fiction. Needs
#                                        target_col, gene_id_col, effect_col,
#                                        pvalue_col, modality, role -- the
#                                        columns that actually exist.
#                         cell_metadata  the obs sidecar for a counts file that
#                                        ships its labels separately. `role`
#                                        alone, like gene_map.
#
# CONTEXT IS DECLARED IN EXACTLY ONE OF TWO WAYS, and a block must pick one:
#   context: <name>     the whole file is one context (every scPerturb block).
#   context_col: <col>  the context varies per ROW and that column names it.
#                       Feng's per-line table is the case: `Cell_Line` holds 19
#                       lines in one file. Setting both, or neither, is a
#                       contract-test failure -- `null` for the unused one is
#                       how a block says which it means, the same idiom
#                       WesselsSatija2023 already uses for `gene_id_col: null`.
#
# WHAT budget_gb MEANS DEPENDS ON route, and this is the one thing in this file
# most likely to be misread:
#   route: download     the ceiling on the SELECTION. The gate refuses files
#                       that exceed it, so a fetch never decides for itself how
#                       much disk it takes.
#   route: stream       the corpus never lands, so its size is not a disk
#                       claim. The ceiling is on the AGGREGATE we write, and
#                       that is what free space is checked against. A block
#                       reading `budget_gb: 12.0` beside a 126 GB corpus is not
#                       a contradiction -- it is 12 GB out, 126 GB read.
#
# Per-file `spec` carries what cannot be inferred from the data and must not be
# guessed -- context name and control label especially. HepG2 is the worked
# example: its obs says `Hep-G2`, Arc's split files say `hepg2`, and no single
# normalization rule maps every label in this file correctly. Declared, not
# derived.
#
# `control_label` MAY BE A LIST, and reading it off the column is not enough.
# Which labels count as controls is a fact about the EXPERIMENT, stated in the
# paper's methods -- not a property of the strings in the column. Feng 2026 is
# the worked example and it cost a wrong conclusion before it was caught: it
# defines its controls as cells with "either no guide or a non-targeting gRNA",
# so its arm is `[NonTarget, unassigned]` and 499,998 cells. Taking only the
# label that READS like a control gives 48 -- a 4-orders-of-magnitude
# undercount, and a delta built on it would be noise presented as signal.
# `checks.control_mask` takes the list and requires every entry to match
# something. When ingesting a new corpus, read its methods for the control
# definition before writing this field.
# ============================================================================

datasets:

  - name: scperturb_multicontext
    enabled: true
    host: zenodo
    record: "13350497"           # v1.4 -- pinned; NOT the concept DOI 7041848
    license: CC-BY-4.0           # expected; the gate re-checks against the API
    budget_gb: 20.0             # 13.95 GB selected; headroom for a point release
    dest: external/zenodo-13350497
    notes: >
      Pre-harmonized CRISPRi corpora giving four cell lines beyond H1. Ingested
      and MD5-verified 2026-08-16. Provides the leave-one-context-out holdout
      that an H1-only mirror cannot.

    files:
      - name: ReplogleWeissman2022_K562_gwps.h5ad
        spec: {context: k562, pert_col: perturbation, control_label: control,
               gene_id_col: ensembl_id, modality: crispri, role: train}
      - name: ReplogleWeissman2022_K562_essential.h5ad
        spec: {context: k562, pert_col: perturbation, control_label: control,
               gene_id_col: ensembl_id, modality: crispri, role: train}
      - name: ReplogleWeissman2022_rpe1.h5ad
        spec: {context: rpe1, pert_col: perturbation, control_label: control,
               gene_id_col: ensembl_id, modality: crispri, role: train}
      - name: NadigOConner2024_jurkat.h5ad
        spec: {context: jurkat, pert_col: perturbation, control_label: control,
               gene_id_col: ensembl_id, modality: crispri, role: train}
      - name: NadigOConner2024_hepg2.h5ad
        spec: {context: hepg2, pert_col: perturbation, control_label: control,
               gene_id_col: ensembl_id, modality: crispri, role: train}

      # Held out of the eval deliberately. This file is Cas13 (direct mRNA
      # degradation), not CRISPRi (transcriptional repression), and is mostly
      # combinatorial: 187 perturbation labels, only 29 single-gene. Scoring
      # THP-1 as a held-out CONTEXT would confound modality with context, so
      # `role: excluded` keeps the data without letting it into the holdout.
      # It also carries no Ensembl ids -- var_names are symbols -- so
      # gene_id_col is null and harmonize() must map symbols before use.
      - name: WesselsSatija2023.h5ad
        spec: {context: thp1, pert_col: perturbation, control_label: control,
               gene_id_col: null, modality: cas13, role: excluded}

  # ==========================================================================
  # The FIRST streamed dataset, and the first whose budget_gb bounds OUTPUT.
  #
  # Read both of those before reading the numbers below, or this block lies to
  # you: 126 GB is what we READ over the network, 12 GB is the ceiling on what
  # we WRITE. Nothing from this corpus ever lands in external/ -- that
  # directory holds this dataset's PROVENANCE.json and nothing else, which is
  # the intended shape (ADR 0003 §1), not a download that failed.
  #
  # Why streamed at all: 126.3 GB of parquet collapses to a per-perturbation
  # pseudobulk of ~10 GB in ONE pass, and we never need the cells again. The
  # Figshare route to the same data is 559.7 GB and its HCT116 file still has
  # no host-computed checksum, so that route stays shut.
  #
  # `dest` vs `derived`: they are deliberately different trees with opposite
  # recovery properties (ADR 0003 §1). external/ is someone else's immutable
  # bytes -- always safe to delete, never backed up. derived/ is ours and
  # expensive -- hours of network to rebuild. Report 07 §2.4 sketched a single
  # `dest: derived/xatlas-orion`, which would put the provenance record inside
  # the expensive tree and break `rm -rf external/<x>` as a safe operation.
  # Split here, following the ADR.
  # ==========================================================================
  - name: xatlas_orion
    enabled: true
    host: huggingface
    record: "Xaira-Therapeutics/X-Atlas-Orion"
    license: CC-BY-NC-SA-4.0    # ShareAlike bites only if we REDISTRIBUTE a derived artifact
    route: stream               # NEW: nothing lands in external/ but PROVENANCE.json
    # Bounds the OUTPUT aggregates, NOT the 126.26 GB read. Raised from 12.0 on
    # 2026-08-25 against a measurement rather than an estimate: the full-corpus
    # run writes 6.76 GB for HCT116 (5.80 main + 0.95 construct-keyed) and 8.02
    # for HEK293T, so the directory holds 14.9 GB with the panel pair beside it.
    # 12.0 was set before any full-corpus artifact existed and was simply wrong.
    # Note this number is ADVISORY on `route: stream` -- the gate spends it as a
    # free-disk reservation at fetch time (`provenance.py:518`) and the streamer
    # never reads it, so nothing refuses an oversized aggregate. It is a
    # declaration of what this source costs, and it has to stay true by hand.
    budget_gb: 20.0
    dest: external/hf-Xaira-Therapeutics-X-Atlas-Orion   # PROVENANCE.json only
    derived: derived/xatlas-orion                        # aggregates + LINEAGE.json
    notes: >
      Genome-wide CRISPRi in HCT116 (109 batches, 46.6 GB) and HEK293T (223
      batches, 79.7 GB). The reason this is on the critical path: its guide
      library targets 300/300 of the 2026 panel, including all 28 targets
      nothing else we hold has ever perturbed, and its expression axis covers
      18,106 of the 18,533 challenge genes -- both measured 2026-08-22 from
      Figshare's guide_library.csv and metadata/gene_metadata.parquet, NOT from
      the HF API. What the HF API confirmed on 2026-08-23 is this block's
      hosting facts only: 332 files, 126.26 GB, the 109/223 split and the
      license. Accumulate PER PERTURBATION, not per (perturbation, batch) --
      109 batches x 18,330 targets is ~1.7 cells per bucket and a ~290 TB dense
      tensor (report 07 §2.3, which overturns ADR 0003 on this point).

    files:
      # Globbed, not listed: 332 per-batch files would be a config block that
      # goes stale the moment Xaira adds a batch. A glob matching zero files is
      # a hard error, so a renamed folder stops the run rather than silently
      # streaming nothing.
      - name: "data/HCT116_*.parquet"
        kind: expression
        spec: {context: hct116, pert_col: gene_target, control_label: Non-Targeting,
               gene_id_col: ensembl_id, modality: crispri, role: train,
               granularity: pseudobulk, batch_col: sample}
      - name: "data/HEK293T_*.parquet"
        kind: expression
        spec: {context: hek293t, pert_col: gene_target, control_label: Non-Targeting,
               gene_id_col: ensembl_id, modality: crispri, role: train,
               granularity: pseudobulk, batch_col: sample}

      # Not expression data: the token -> gene lookup the long-format parquet is
      # useless without. `gene_token_id` in the data files indexes into this
      # table, so streaming without it yields counts on an unnamed axis.
      # 0.88 MB. Listed here so it is inside the gate's selection and carries a
      # checksum in PROVENANCE.json; the STREAMING READER fetches it, not
      # `sidechain.ingest.fetch` -- on route: stream that entry point downloads
      # nothing at all, this file included.
      - name: metadata/gene_metadata.parquet
        kind: gene_map
        spec: {role: reference, id_cols: [gene_token_id, ensembl_id, gene_name]}

  # ==========================================================================
  # The first two LAMIN-STREAMED datasets (T28's first stream), picked by the
  # 2026-08-27 fifth-context sweep over laminlabs/pertdata (27 probeable
  # datasets) and altoslabs/perturbench (3): the two best panel-coverage
  # candidates among corpora we do not already hold. The sweep's headline is
  # NEGATIVE and worth keeping: nothing public and harmonized covers the 2026
  # panel like a genome-wide screen does -- the maximum anywhere was
  # mcfaline23's 17 of the 272 loco-fold targets, an order of magnitude below
  # Feng's 172, which already failed to help (reports/07 §3.4). These two are
  # streamed to SCORE that negative rather than argue it.
  #
  # `host: lamin` probes the instance REGISTRY (keys, sizes, lamin hashes) and
  # can never learn a license from it -- no field on the lamin Artifact model
  # carries terms (research/inbox/2026-08-27_lamin-instance-enumeration.md,
  # private). Hence `license_override_source` on both blocks: the terms were
  # verified at the ORIGINAL host, named there, and recorded as an override in
  # PROVENANCE.json. The gate refuses an override that CONTRADICTS a host that
  # states terms; lamin states none, which is the one situation overrides are
  # for.
  # ==========================================================================
  - name: pertdata_sunshine23
    enabled: true
    host: lamin
    record: "laminlabs/pertdata"
    license: CC-BY-4.0
    license_override_source: >
      scPerturb Zenodo record 13350497 v1.4 declares CC-BY-4.0 and its file
      list includes SunshineHein2023.h5ad (verified at the 2026-08-16 ingest,
      external/zenodo-13350497/PROVENANCE.json); the pertdata scperturb/ tree
      is Lamin's curated re-annotation of that corpus. Lamin metadata itself
      cannot state a license (2026-08-27 enumeration).
    route: stream                # obs/var/X read remotely; only the pseudobulk lands
    budget_gb: 1.0               # OUTPUT ceiling: ~184 labels x 33,538 genes x 3 float64 arrays
    dest: external/lamin-laminlabs-pertdata      # PROVENANCE.json only
    derived: derived/lamin-pertdata              # aggregates + per-artifact .lineage.json
    notes: >
      Sunshine 2023 (SunshineHein2023): CRISPRi in Calu-3, 90,380 cells, 183
      single-gene targets (SARS-CoV-2 host-factor panel). Covers 6 of the 272
      loco_k562gwps fold targets (BCKDK, IFNAR2, LDLR, MYD88, TMEM41B, TRMT1;
      135-700 cells each) and 6/300 of the challenge panel -- measured
      2026-08-27 from obs.parquet alone. Labels are pert_target_multi
      (stringified lists; single-token rows only), controls are the
      dual-NTC cells found via pert_name startswith 'non-targeting'
      (6,745 cells) and labelled 'control' in the aggregate -- the raw column
      has no control value, which is why control_label here names the DERIVED
      label. X is raw integer counts; var is indexed by ensembl_id with the
      symbol column the pooling matches on.
      EVERY CELL IS SARS-CoV-2-INFECTED (MOI 4, 24 h) -- the study has NO mock
      arm, and the curation keeps no infection-status column (verified
      2026-08-27, research/reading/sunshine23-infection-arm-verification.md,
      private). Deltas are target-vs-NTC within one infected culture, so they
      are internally consistent, but as a prior for uninfected lines this is
      an INFECTED context and must be described as one. Also verified there:
      scPerturb's own metadata calls this dataset CRISPR-cas9; the paper is
      dCas9-KRAB CRISPRi, so the modality declared here is the PAPER's, not
      the curation's.
    files:
      - name: scperturb/sunshine23/X.h5ad
        kind: expression
        spec: {context: calu3, context_col: null, pert_col: pert_target_multi,
               control_label: control, gene_id_col: ensembl_id,
               modality: crispri, role: train, granularity: cell}
      - name: scperturb/sunshine23/obs.parquet
        kind: cell_metadata
        spec: {role: reference}
      - name: scperturb/sunshine23/var.parquet
        kind: gene_map
        spec: {role: reference, id_cols: [ensembl_id, symbol]}

  - name: perturbench_mcfaline23
    enabled: true
    host: lamin
    record: "altoslabs/perturbench"
    license: CC-BY-4.0
    license_override_source: >
      huggingface.co/datasets/altoslabs/perturbench declares cc-by-4.0 (HF API
      cardData.license, verified 2026-08-27); the lamin instance's processed
      h5ads are the same project's artifacts, mirrored on that HF repo. Lamin
      metadata itself cannot state a license (2026-08-27 enumeration).
    route: stream
    budget_gb: 1.0               # OUTPUT ceiling: ~530 labels x 15,004 genes x 3 float64 arrays
    dest: external/lamin-altoslabs-perturbench   # PROVENANCE.json only
    derived: derived/lamin-perturbench           # aggregates + per-artifact .lineage.json
    notes: >
      McFaline-Figueroa 2023 sci-Plex-GxE: CRISPRi kinome screen (527 real
      gene targets) in three glioblastoma lines (A172, T98G, U87MG) under five
      environments. THE AGGREGATE TAKES ONLY treatment=none AND
      sample=sci3_CRISPRi_kinome: the drug arms would blend an environment
      into every knockdown delta, and a 2,965-cell MMR/HPRT1 CROP-seq
      sub-experiment hides inside the none arm (both measured 2026-08-27).
      Covers 17/272 loco-fold targets (882-1,629 cells each, all present in
      all three lines) and 23/300 of the challenge panel -- the best coverage
      of anything public we do not already hold, and still 16x below X-Atlas.
      `context: gbm_pooled` names the three-line pool the aggregate takes --
      one vote, like Feng's pooled iPSC arm, not a rotation. The processed
      file's X is LOG-NORMALISED; raw integer counts live in layers/counts,
      which is what streams (--x-path layers/counts). Controls are labelled
      'control' in gene_id directly (207,235 cells corpus-wide; the none-arm
      subset anchors the aggregate). 'RcontrolSEL' (1,316 cells) is an
      unflagged random-control pseudo-target and is dropped by name.
      'none' IS THE VEHICLE ARM, not drug-free media: perturbench's curation
      rewrites the paper's 'vehicle'/'dmso' labels to 'none', and every arm --
      drug and control alike -- sits at 0.1% v/v DMSO, so the carrier cancels
      in a within-screen delta (verified 2026-08-27,
      research/reading/mcfaline23-none-arm-verification.md, private; CRISPRi
      dCas9-KRAB confirmed there too).
    files:
      - name: mcfaline23_gxe_processed.h5ad
        kind: expression
        spec: {context: gbm_pooled, context_col: null, pert_col: gene_id,
               control_label: control, gene_id_col: null,
               modality: crispri, role: train, granularity: cell}

  # ==========================================================================
  # Feng et al. 2026 -- genome-scale CRISPRi across human iPSC lines.
  # Cell Genomics 6:101076 (PMC12903452). Two Figshare records, both MIT: the
  # most permissive terms of anything we hold and the only source with no
  # redistribution encumbrance at all.
  #
  # WHAT THIS BUYS, measured 2026-08-23 from the fetched tables themselves:
  #   * the genome-wide arm's published table covers 182 of the 300 panel
  #     targets. Of those 182: 172 are already covered by K562-gwps, and 10 are
  #     targets NOTHING we hold had perturbed (ABCD1, HEATR6, MAPK7, PARP3,
  #     PDK3, SLC44A1, SNN, TAF4, TBC1D19, ZC2HC1A). The 10 are a SUBSET of the
  #     182, not additional to it -- pool coverage goes 272 -> 282, and 18 of
  #     the 300 remain uncovered by anything.
  #   * the targeted arm covers 5 of the 300 and 0 of the 28 -- it is NOT a
  #     prior source and is not taken as one. It is here because 444 targets x
  #     19 lines x median 74 cells per (target, line) is the only DENSE
  #     replicate structure we
  #     have, and method questions (does delta transfer adapt or just average?
  #     line versus donor? is shrinkage erasing signal?) need that, not breadth.
  #
  # A NOTE ON 182 vs 197, because both numbers are true of different things and
  # the difference is a trap: the CELL METADATA carries guide calls for 7,218
  # targets, 197 of which are on the panel. The PUBLISHED LFC TABLE has only
  # 6,673 targets, 182 on the panel -- 545 assayed targets did not survive into
  # it. The guide-call number is an upper bound on what is usable and must not
  # be quoted as coverage; only the table's own `Target` column counts.
  #
  # WHY IT IS WEIGHTED DOWN HARD, and this is the number that matters: the
  # genome-wide arm is 219,206 cells on a targeting guide over 7,218 targets --
  # median 25 cells per target, against ~170 for K562-gwps. It is a thin
  # genome-scale second opinion on per-gene DIRECTION, not a deep screen. It is
  # also ONE POOLED CONTEXT: the published per-gene table has no line column,
  # so the 34 lines are a donor-variation axis inside the pool, not a rotation.
  # `reports/07` §3, `ideas/feng-2026-ipsc-crispri-map.md` (private).
  # ==========================================================================
  - name: feng_2026_lfc
    enabled: true
    host: figshare
    record: "26819743.v1"       # `.v1` PINS it. A bare Figshare id follows "latest".
    license: MIT
    budget_gb: 3.8              # 2.71 GB selected; ~40 % headroom for a point release
    dest: external/figshare-26819743
    notes: >
      Precomputed per-gene log fold changes -- the contrast is ALREADY TAKEN,
      so these files carry no control arm and no counts. That is why they are
      `kind: lfc_table` rather than expression: asking them for a control label
      is meaningless. They feed `pooled_delta` through an (lfc, var) source
      type rather than a fabricated pseudobulk, because Feng has no per-cell
      CPM sums and inventing them would put fiction into the one object every
      downstream consumer trusts as measured.

      Feng ships NO variance and `pooled_delta` weights by 1/var, so it is
      derived from `pval_adj`: invert BH to a nominal p, two-sided z,
      se = |lfc|/z, var = se^2. GUARD: `pval_adj` saturates at ~1.0 for most
      rows (every row of the genome-wide file's first block reads
      0.999999927233465), which sends z -> 0 and var -> infinity. Floor the
      variance and count how many genes survive with finite weight BEFORE
      pooling. reports/07 §3.3.

    files:
      # ONE pooled context. Header, read 2026-08-23: Target,
      # Expressed_Gene_Symbol, Expressed_Gene_Ens_ID, lfc, pval_adj.
      #
      # MEASURED FROM THE FILE 2026-08-23, and two of these are smaller than
      # the paper and reports/07 imply -- quote these, not those:
      #   43,187,656 rows = 6,673 targets x 6,472 expressed genes, EXACTLY
      #   (rows per target: min = median = max = 6,472; a complete rectangle).
      #   * 6,673 targets, not 7,226. 545 of the 7,218 targets that actually
      #     carry guide calls were dropped from the published table.
      #   * the expressed axis is 6,472 genes, of which 6,151 are on the
      #     18,533-gene challenge axis -- so Feng votes on 33 % of the axis
      #     and is silent on the other two thirds. It cannot be a dense source.
      #   * panel coverage 182 / 300, orphan coverage 10 / 28, and those 10
      #     (ABCD1, HEATR6, MAPK7, PARP3, PDK3, SLC44A1, SNN, TAF4, TBC1D19,
      #     ZC2HC1A) are the whole net-new contribution over everything held.
      #   * 98.9 % of rows have pval_adj > 0.99. Per panel target the count of
      #     NON-saturated genes runs min 7 / median 58 / max 269, and no target
      #     has zero. So the variance-from-p weighting yields a usable weight
      #     on ~58 genes per target and a floored one everywhere else -- which
      #     is the intended behaviour, not a bug, but it means Feng is a
      #     SPARSE directional vote and must be described as one.
      #
      # Its own non-Ensembl entry in Expressed_Gene_Ens_ID is `PURO`.
      - name: GenomeWideScreen_LFC_byGene.tsv.gz
        kind: lfc_table
        spec: {context: ipsc_pooled, context_col: null, target_col: Target,
               gene_id_col: Expressed_Gene_Ens_ID, gene_symbol_col: Expressed_Gene_Symbol,
               effect_col: lfc, pvalue_col: pval_adj, pvalue_adjusted: true,
               modality: crispri, role: train}

      # 53,490,080 rows: 444 targets x 19 lines (report 07 §3.1 says 20 --
      # measured 2026-08-23 from the file itself, it is 19). Header adds two
      # columns over the genome-wide file: `Cell_Line` (which is why context is
      # per-ROW here, not per-file) and `wt_expr` (baseline expression, absent
      # from the genome-wide table).
      #
      # THE GRID IS RAGGED -- 8,204 (target, line) pairs of a full 8,436, and
      # lines per target runs min 13 / median 19 / max 19. Median and max are
      # both 19, so any summary statistic hides it; the minimum is the finding.
      # Anything comparing targets ACROSS lines has to handle a missing cell
      # rather than assume the rectangle.
      #
      # The 19 lines are 9 donors x 2 clones plus one singleton (eipl_1/eipl_3,
      # fiaj_1/fiaj_3, ... zapk_3 alone) -- that nesting is the donor-versus-
      # line axis, and it is readable straight off the labels.
      #
      # TRAP, measured not read: `Expressed_Gene_Ens_ID` is NOT all Ensembl. It
      # carries three transgenes under their own names -- `BSD` (blasticidin
      # resistance), `dCas9-KRAB-MeCP2` (the CRISPRi effector itself) and
      # `mScarlet` (a fluorescent reporter) appear as rows with those literal
      # strings in the Ensembl column. The genome-wide file has its own,
      # different one: `PURO`. A strict Ensembl read raises on them, correctly;
      # a naive one carries a plasmid into the gene axis as if it were human.
      - name: TargetedScreen_LFC_byGene-perLine.tsv.gz
        kind: lfc_table
        spec: {context: null, context_col: Cell_Line, target_col: Target,
               gene_id_col: Expressed_Gene_Ens_ID, gene_symbol_col: Expressed_Gene_Symbol,
               effect_col: lfc, pvalue_col: pval_adj, pvalue_adjusted: true,
               baseline_expr_col: wt_expr, modality: crispri, role: analysis}

  # ==========================================================================
  # The genome-wide arm's raw counts. Taken now rather than deferred (Saber,
  # 2026-08-23) so the analysis substrate is on disk before it is wanted.
  #
  # THE CONTROL ARM IS `unassigned`, AND IT IS 499,998 CELLS. Feng defines its
  # controls as cells "assigned to a donor but either NO GUIDE or a
  # non-targeting gRNA" (paper, PMC12903452), so the `unassigned` label is the
  # control arm rather than discarded cells. Measured from the Cell-Metadata
  # files and exact against the paper: 499,950 unassigned + 48 NonTarget =
  # 499,998 control, and 219,206 carrying a targeting guide.
  #
  # Only 48 cells have a `Guide_Call` reading `NonTarget_*` (36 fitness, 12
  # non-fitness, over 9 detected guides of the 40 in the library). An earlier
  # version of this comment took that 48 for the whole control arm and
  # concluded the counts could not support recomputing the contrast. Wrong by
  # four orders of magnitude, and the opposite conclusion: ~500k controls
  # against 219k perturbed is ample. Post-mortem in reports/07 §3.5 (private).
  #
  # So these counts are good for two things, not one: recomputing the contrast
  # our own way if Feng's normalization proves incompatible, AND everything the
  # pooled table threw away -- `Cell_Line` is labelled PER CELL here, so the
  # per-line structure the published genome-wide table lacks is recoverable
  # from these bytes and nowhere else.
  #
  # The targeted arm's own counts (TargetedScreen_RNA-UMI-Counts.csv.gz, 4.48
  # GB) are deliberately NOT selected -- see the note at the end of this block.
  # ==========================================================================
  - name: feng_2026_counts
    enabled: true
    host: figshare
    record: "27989294.v2"
    license: MIT
    budget_gb: 11.0             # 7.93 GB selected -- the WHOLE record; ~40 % headroom
    dest: external/figshare-27989294
    notes: >
      SHAPE WARNING, measured not assumed. The RNA count CSVs are
      GENES x CELLS -- cells are COLUMNS (the fitness file's header row is
      180,461 cell ids) -- which is transposed relative to every h5ad we hold,
      and they are DENSE text. Read them line by line: one line is one gene
      across all cells, which suits a per-gene accumulator and is the only way
      these fit in memory at all. Never `read_csv` one whole.

      CELL IDs DO NOT MATCH ACROSS THE THREE FILES and joining them naively is
      a silent misjoin. The same barcode is spelled three ways:
        Cell-Metadata      MP-ST-P3-D3_I1_AAACCTGAGACGCAAC-1
        RNA-UMI-Counts        ST-P3-D3_I1_AAACCTGAGACGCAAC-1   (no `MP-`)
        Guide-UMI-Counts   MP.ST.P3.D3_I1_AAACCTGAGACGCAAC.1   (R make.names)
      Normalise all three to one form and assert the join covers every cell
      before using it -- an unmatched-row count of zero is the check, not a
      spot inspection.

      `Guide_Call` is `<TARGET>_<sgRNA sequence>`, `NonTarget_<sgRNA>`, or the
      literal `unassigned` (69 % of genome-wide cells). The perturbation label
      is the part before the LAST underscore, so exact-match control matching
      must run on that derived column and never on the raw one. AND the control
      set is BOTH `NonTarget` and `unassigned` -- see the block comment above;
      treating only `NonTarget` as control leaves a 48-cell control arm instead
      of a 499,998-cell one.

    files:
      # Fitness pool -- genes whose knockdown impairs growth, harvested EARLY
      # (3, 4, 5 DPI) before those cells drop out of the screen. 2,259 targets,
      # 322,746 cells, 104,094 on a targeting guide, 24 lines, 218,652 control.
      - name: GenomeWideScreen_FitnessGenes_RNA-UMI-Counts.csv.gz
        kind: expression
        spec: {context: null, context_col: Cell_Line, pert_col: Guide_Call,
               pert_label_from: guide_call_prefix,
               control_label: [NonTarget, unassigned],
               obs_from: GenomeWideScreen_FitnessGenes_Cell-Metadata.tsv.gz,
               cell_id_col: Cell_ID, batch_col: Batch, orientation: genes_by_cells,
               gene_id_col: null, counts_are_raw: true, granularity: cell,
               modality: crispri, role: analysis}

      # Non-fitness pool -- everything else, harvested at 6 DPI to let the
      # response develop. 4,959 targets, 396,458 cells, 115,112 on a targeting
      # guide, 34 lines, 281,346 control. The two pools are on different clocks,
      # so comparing an effect across them compares timepoints too.
      - name: GenomeWideScreen_NonFitnessGenes_RNA-UMI-Counts.csv.gz
        kind: expression
        spec: {context: null, context_col: Cell_Line, pert_col: Guide_Call,
               pert_label_from: guide_call_prefix,
               control_label: [NonTarget, unassigned],
               obs_from: GenomeWideScreen_NonFitnessGenes_Cell-Metadata.tsv.gz,
               cell_id_col: Cell_ID, batch_col: Batch, orientation: genes_by_cells,
               gene_id_col: null, counts_are_raw: true, granularity: cell,
               modality: crispri, role: analysis}

      # The obs sidecars. Without these the count matrices have no perturbation
      # label, no line and no batch -- they are the only place any of that
      # lives, which is why they are selected rather than skipped as small.
      # Cell_ID, Batch, Guide_Call, Cell_Line. 3.6 + 4.2 MB.
      - name: GenomeWideScreen_FitnessGenes_Cell-Metadata.tsv.gz
        kind: cell_metadata
        spec: {role: reference}
      - name: GenomeWideScreen_NonFitnessGenes_Cell-Metadata.tsv.gz
        kind: cell_metadata
        spec: {role: reference}

      # The raw guide evidence behind `Guide_Call`: guides x cells, so a
      # multiplet or a marginal call can be re-adjudicated rather than trusted.
      # 50 + 105 MB.
      - name: GenomeWideScreen_FitnessGenes_Guide-UMI-Counts.csv.gz
        kind: cell_metadata
        spec: {role: reference}
      - name: GenomeWideScreen_NonFitnessGenes_Guide-UMI-Counts.csv.gz
        kind: cell_metadata
        spec: {role: reference}

      # ==================================================================
      # The TARGETED arm's cells. Taken 2026-08-24 (Saber) for method
      # development, which is the only thing this arm is for -- it covers 5 of
      # the 300 panel targets and 0 of the 28 orphans, so it is not and will
      # never be a prior source. What it is instead: the densest replicate
      # structure we hold. 444 targets x 19 lines x median 74 cells per
      # (target, line), and the 19 lines are NESTED IN 10 DONORS (2 clones per
      # donor, readable off the labels: eipl_1/eipl_3, fiaj_1/fiaj_3, ...
      # zapk_3 alone). That nesting is the only clean way we have to separate
      # "this line differs" from "this donor differs".
      #
      # Measured 2026-08-24 against the paper; it agrees on every figure except
      # one piece of prose. Cells 1,161,864 (exact), 19 lines recovered of 20
      # designed (the paper states both), median 74 cells per (target, line)
      # (exact), 6,517 expressed genes (exact -- the per-line LFC table's 6,520
      # is those plus the three transgenes).
      #
      # THE PROSE IMPRECISION, so the next reader does not re-derive it: the
      # paper says "assigned 635,022 (55%) to 444 targets". Measured, 635,022
      # is cells assigned to ANY guide; only 626,781 carry a TARGETING guide
      # and the other 8,241 are non-targeting. The difference is exactly the
      # NTC count, so the arithmetic is sound and only the sentence is loose.
      #
      # Control arm here, as in the genome-wide arm: NonTarget + unassigned =
      # 8,241 + 526,842 = 535,083 cells (46 %). The targeted library carries
      # 20 non-targeting guides and all 20 are detected, unlike the genome-wide
      # arm where only 9 of 40 appear.
      # ==================================================================
      - name: TargetedScreen_RNA-UMI-Counts.csv.gz
        kind: expression
        spec: {context: null, context_col: Cell_Line, pert_col: Guide_Call,
               pert_label_from: guide_call_prefix,
               control_label: [NonTarget, unassigned],
               obs_from: TargetedScreen_Cell-Metadata.tsv.gz,
               cell_id_col: Cell_ID, batch_col: Batch, orientation: genes_by_cells,
               gene_id_col: null, counts_are_raw: true, granularity: cell,
               modality: crispri, role: analysis}

      - name: TargetedScreen_Cell-Metadata.tsv.gz
        kind: cell_metadata
        spec: {role: reference}
      - name: TargetedScreen_Guide-UMI-Counts.csv.gz
        kind: cell_metadata
        spec: {role: reference}
